<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawHouse Acceptance Workbench</title>
  <style>
    :root {
      --bg: #fbfbfa;
      --surface: #ffffff;
      --selected: #f5f5f5;
      --border: #f2f2f2;
      --border-strong: #e5e5e2;
      --strong: #292929;
      --default: #5d5d5d;
      --subtle: #7f7f7f;
      --green: #2f6f4e;
      --red: #a23a35;
      --amber: #8b6424;
      --blue: #2f5f8f;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--strong);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: auto;
    }

    .sidebar-top {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand strong {
      font-size: 16px;
      font-weight: 650;
    }

    .workspace-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: #ffffff;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--default);
    }

    .search {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--selected);
      padding: 7px 9px;
      outline: none;
    }

    .sidebar-section {
      padding: 12px 10px 18px;
      display: grid;
      gap: 10px;
    }

    .sidebar-label,
    .field label,
    .tab-meta {
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.35;
    }

    .flow-block {
      display: grid;
      gap: 4px;
    }

    .access-filter-row {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .access-filter-button {
      min-height: 24px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--subtle);
      padding: 3px 7px;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
    }

    .access-filter-button.active,
    .access-filter-button:hover {
      border-color: var(--border-strong);
      background: var(--selected);
      color: var(--strong);
    }

    #flowList {
      display: grid;
      gap: 6px;
    }

    .flow-button,
    .step-button,
    .tab,
    .button,
    .mini-button {
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .flow-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 32px;
      border-radius: 7px;
      padding: 7px 8px;
      text-align: left;
      color: var(--strong);
      font-weight: 560;
      line-height: 1.25;
    }

    .flow-button.active,
    .flow-button:hover,
    .step-button.active,
    .step-button:hover {
      background: var(--selected);
    }

    .flow-title {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .flow-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flow-chevron {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid var(--subtle);
      border-bottom: 1.5px solid var(--subtle);
      transform: rotate(-45deg);
      transition: transform 120ms ease-out, border-color 120ms ease-out;
    }

    .flow-button[aria-expanded="true"] .flow-chevron {
      transform: rotate(45deg);
    }

    .flow-button.active .flow-chevron,
    .flow-button:hover .flow-chevron {
      border-color: var(--default);
    }

    .step-list {
      display: grid;
      gap: 2px;
      margin-left: 12px;
      padding-left: 9px;
      border-left: 1px solid var(--border);
    }

    .step-list[hidden] {
      display: none;
    }

    .step-button {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 30px;
      border-radius: 7px;
      padding: 5px 7px;
      text-align: left;
      color: var(--default);
      font-size: 12px;
      line-height: 1.25;
    }

    .step-button strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 520;
    }

    .step-button.active strong {
      color: var(--strong);
      font-weight: 600;
    }

    .access-tag {
      justify-self: end;
      border-radius: 5px;
      background: var(--selected);
      color: var(--subtle);
      padding: 2px 5px;
      font-size: 11px;
      line-height: 1.2;
    }

    .access-tag.protected {
      color: var(--red);
    }

    .access-tag.public {
      color: var(--green);
    }

    .verb {
      justify-self: start;
      width: 50px;
      border-radius: 5px;
      background: var(--selected);
      color: var(--default);
      padding: 3px 5px;
      font-family: var(--mono);
      font-size: 11px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-chevron {
        transition: none;
      }
    }

    .verb.post,
    .verb.script {
      color: var(--blue);
    }

    .verb.view {
      color: var(--amber);
    }

    .verb.todo {
      color: var(--red);
    }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 10px 14px;
      background: rgba(251, 251, 250, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--default);
      font-size: 12px;
    }

    .crumb-current {
      color: var(--strong);
      font-weight: 560;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .env-control {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .env-select,
    .select,
    .input,
    .textarea {
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #ffffff;
      outline: none;
    }

    .env-select {
      height: 32px;
      min-width: 172px;
      padding: 6px 9px;
    }

    .env-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(47, 111, 78, 0.08);
    }

    .env-dot.dev {
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 95, 143, 0.08);
    }

    .env-dot.staging {
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(139, 100, 36, 0.1);
    }

    .env-dot.production {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(162, 58, 53, 0.08);
    }

    .button,
    .mini-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #ffffff;
      padding: 7px 10px;
      font-weight: 560;
      white-space: nowrap;
    }

    .button:hover,
    .mini-button:hover {
      background: var(--selected);
    }

    .button.primary {
      border-color: var(--strong);
      background: var(--strong);
      color: #ffffff;
    }

    .button.primary:hover {
      background: #111111;
    }

    .button.primary:disabled {
      border-color: var(--border-strong);
      background: #eeeeee;
      color: var(--default);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .mini-button {
      min-height: 28px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .env-drawer {
      display: none;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 12px;
      padding: 12px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    .env-drawer.open {
      display: grid;
    }

    .env-summary {
      display: grid;
      gap: 6px;
      align-content: start;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fbfbfa;
    }

    .env-summary-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .env-summary-title strong {
      font-size: 13px;
      font-weight: 650;
    }

    .env-summary p {
      margin: 0;
      color: var(--default);
      font-size: 12px;
      line-height: 1.45;
    }

    .workbench {
      min-width: 0;
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .request-shell,
    .response-shell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .request-head,
    .response-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .title-block {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .request-description {
      max-width: 860px;
      margin: 2px 0 0;
      color: var(--default);
      font-size: 13px;
      line-height: 1.42;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 650;
      line-height: 1.2;
    }

    h1 {
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    h2 {
      font-size: 16px;
    }

    .request-line {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr) auto;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .select,
    .input {
      width: 100%;
      height: 36px;
      padding: 8px 10px;
    }

    .request-target {
      font-family: var(--mono);
      font-size: 12px;
    }

    .request-target.pending {
      color: var(--subtle);
      background: #fbfbfb;
    }

    .input[readonly] {
      color: var(--default);
      background: #fafafa;
    }

    .input:focus,
    .textarea:focus,
    .select:focus,
    .env-select:focus {
      border-color: var(--strong);
      box-shadow: 0 0 0 2px rgba(41, 41, 41, 0.08);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab {
      min-height: 38px;
      border-radius: 0;
      padding: 10px 10px;
      color: var(--default);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--strong);
      border-bottom-color: var(--strong);
      font-weight: 560;
    }

    .tab-body {
      padding: 14px;
    }

    .fields {
      display: grid;
      gap: 9px;
    }

    .params-fields {
      grid-template-columns: 1fr;
    }

    .params-fields .kv-row {
      grid-template-columns: minmax(120px, 170px) minmax(0, 1fr);
    }

    .kv-row {
      display: grid;
      grid-template-columns: minmax(120px, 210px) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .textarea {
      width: 100%;
      min-height: 168px;
      resize: vertical;
      padding: 10px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }

    .code {
      margin: 0;
      padding: 12px;
      background: #191919;
      color: #eeeeee;
      border-radius: 7px;
      overflow: auto;
      min-height: 180px;
      max-height: 520px;
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }

    .light-code {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fafafa;
      color: var(--strong);
      overflow: auto;
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }

    .result-view {
      display: grid;
      gap: 10px;
      min-height: 180px;
    }

    .result-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fafafa;
      color: var(--default);
      font-size: 13px;
    }

    .response-console {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #ffffff;
      overflow: hidden;
    }

    .response-console-bar,
    .result-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: #fcfcfb;
    }

    .response-tabs,
    .response-metrics {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .response-tab {
      appearance: none;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--default);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 560;
      padding: 0 0 7px;
      white-space: nowrap;
    }

    .response-tab.active {
      border-bottom-color: var(--strong);
      color: var(--strong);
      font-weight: 650;
    }

    .response-tab:hover {
      color: var(--strong);
    }

    .metric {
      color: var(--default);
      font-family: var(--mono);
      font-size: 12px;
      white-space: nowrap;
    }

    .metric.ok {
      color: var(--green);
      font-weight: 650;
    }

    .metric.fail {
      color: var(--red);
      font-weight: 650;
    }

    .metric.warn {
      color: var(--amber);
      font-weight: 650;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #eadfc8;
      border-top-color: var(--amber);
      border-radius: 999px;
      animation: spin 780ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-summary {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .result-summary.ok {
      box-shadow: inset 3px 0 0 var(--green);
    }

    .result-summary.fail {
      box-shadow: inset 3px 0 0 var(--red);
    }

    .result-summary.running {
      background: #fffdf8;
      box-shadow: inset 3px 0 0 var(--amber);
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .result-title {
      color: var(--strong);
      font-size: 14px;
      font-weight: 650;
    }

    .result-title.with-spinner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .result-message {
      color: var(--default);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .response-panel {
      background: #ffffff;
    }

    .response-panel[hidden] {
      display: none;
    }

    .response-panel-block {
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .response-panel-block:last-child {
      border-bottom: 0;
    }

    .result-panel-head {
      color: var(--strong);
      font-size: 13px;
      font-weight: 620;
    }

    .result-panel-meta {
      color: var(--subtle);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 520;
      white-space: nowrap;
    }

    .stream-empty {
      display: grid;
      min-height: 128px;
      place-items: center;
      color: var(--default);
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }

    .stream-empty.small {
      min-height: 96px;
    }

    .result-code {
      max-height: 460px;
      overflow: auto;
      background: #ffffff;
      color: var(--strong);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }

    .code-line {
      display: grid;
      grid-template-columns: 44px minmax(max-content, 1fr);
      min-width: max-content;
    }

    .code-line-number {
      position: sticky;
      left: 0;
      z-index: 1;
      padding: 0 10px 0 6px;
      border-right: 1px solid var(--border);
      background: #fbfbfa;
      color: #a0a09b;
      text-align: right;
      user-select: none;
    }

    .code-line-text {
      padding: 0 12px;
      white-space: pre;
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--selected);
      color: var(--default);
      font-size: 12px;
      font-weight: 560;
    }

    .pill.ok {
      color: var(--green);
      background: #edf6f1;
    }

    .pill.fail {
      color: var(--red);
      background: #fbefed;
    }

    .toast {
      position: fixed;
      top: 66px;
      right: 18px;
      z-index: 20;
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #ffffff;
      color: var(--strong);
      box-shadow: 0 10px 30px rgba(41, 41, 41, 0.12);
      font-size: 12px;
      font-weight: 560;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .pill.warn {
      color: var(--amber);
      background: #faf3e5;
    }

    .pill.pending {
      color: var(--red);
      background: #fbefed;
    }

    .response-shell {
      display: grid;
    }

    .response-body {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .vars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }

    .response-vars-grid {
      padding: 10px;
    }

    .var-card {
      display: grid;
      gap: 4px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #ffffff;
      min-width: 0;
    }

    .var-key {
      color: var(--subtle);
      font-family: var(--mono);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .var-value {
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--subtle);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
      }

      .env-drawer {
        grid-template-columns: 1fr;
      }

      .request-line {
        grid-template-columns: 96px minmax(0, 1fr);
      }

      .request-line .button {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 680px) {
      .topbar,
      .request-head,
      .response-head {
        align-items: stretch;
        flex-direction: column;
      }

      .env-control {
        justify-content: flex-start;
        width: 100%;
      }

      .env-select {
        min-width: 0;
        flex: 1;
      }

      .kv-row {
        grid-template-columns: 1fr;
      }

      .params-fields {
        grid-template-columns: 1fr;
      }

      .params-fields .kv-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand">
            <strong>ClawHouse</strong>
            <span class="sidebar-label">Acceptance</span>
          </div>
          <span id="workspacePill" class="workspace-pill">Local</span>
        </div>
        <input id="filter" class="search" placeholder="Filter requests" />
        <div id="accessFilter" class="access-filter-row" role="group" aria-label="Request access filter"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Collections</div>
        <div id="flowList"></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="crumbs">
          <span>Collections</span>
          <span>/</span>
          <span id="crumbFlow"></span>
          <span>/</span>
          <span id="crumbStep" class="crumb-current"></span>
        </div>
        <div class="env-control">
          <span id="envDot" class="env-dot"></span>
          <select id="envSelect" class="env-select">
            <option value="local">Local</option>
            <option value="dev">Dev</option>
            <option value="staging">Staging</option>
            <option value="production">Production</option>
          </select>
          <button id="toggleEnv" class="mini-button">Environment</button>
        </div>
      </header>

      <section id="envDrawer" class="env-drawer">
        <div class="field">
          <div class="env-summary">
            <div class="env-summary-title">
              <strong id="envProfileName">Local</strong>
              <span id="envProfileBranch" class="pill">local</span>
            </div>
            <p id="envProfileDescription"></p>
            <p>Secrets stay out of git. Fill tokens, database URLs, and private keys only in this local browser editor.</p>
          </div>
          <label>Environment JSON</label>
          <textarea id="envEditor" class="textarea"></textarea>
        </div>
        <div class="field">
          <label>Runtime Variables JSON</label>
          <textarea id="varsEditor" class="textarea"></textarea>
          <div class="pill-row">
            <button id="saveEnv" class="mini-button">Save</button>
            <button id="clearVars" class="mini-button">Clear Runtime Vars</button>
          </div>
        </div>
      </section>

      <section class="workbench">
        <div class="request-shell">
          <div class="request-head">
            <div class="title-block">
              <h1 id="stepName">Request</h1>
              <p id="stepDescription" class="request-description"></p>
              <span id="stepType" class="tab-meta"></span>
            </div>
            <div id="requestPills" class="pill-row"></div>
          </div>

          <div class="request-line">
            <select id="methodSelect" class="select"></select>
            <input id="requestTarget" class="input request-target" />
            <button id="fireStep" class="button primary">Send</button>
          </div>

          <nav id="tabs" class="tabs"></nav>
          <div id="tabBody" class="tab-body"></div>
        </div>

        <div class="response-shell">
          <div class="response-head">
            <div class="title-block">
              <h2>Response</h2>
              <span id="responseTarget" class="tab-meta">No request sent.</span>
            </div>
            <div class="pill-row">
              <button id="copyDebugContext" class="mini-button" disabled>Copy Debug Context</button>
              <div id="resultMeta" class="pill-row"></div>
            </div>
          </div>
          <div class="response-body">
            <div id="resultBox" class="result-view">
              <div class="result-empty">No response yet.</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "clawhouse.acceptance.workbench.v2";
    const defaultEnv = {
      repoRoot: "",
      ledgerBaseUrl: "http://127.0.0.1:4321",
      nearRpcUrl: "https://rpc.testnet.near.org",
      contractId: "clawhouse-key-20260619125948.testnet",
      nearNetworkId: "testnet",
      testUserAccountId: "",
      testUserPrivateKey: "",
      accountId: ""
    };

    const obsoleteEnvKeys = [
      "baseUrl",
      "apiToken",
      "reviewer",
      "ironclawBaseUrl",
      "ironclawWebhookUrl",
      "ironclawWebhookSecret"
    ];

    const environmentProfiles = {
      local: {
        label: "Local",
        branch: "local",
        description: "Runs against the local Workbench runner and local ClawHouse backend on your machine.",
        env: {
          ledgerBaseUrl: "http://127.0.0.1:4321"
        }
      },
      dev: {
        label: "Dev",
        branch: "dev",
        description: "Integration target for the dev branch. Paste a current dev or preview backend URL before sending backend requests.",
        env: {
          ledgerBaseUrl: ""
        }
      },
      staging: {
        label: "Staging",
        branch: "staging",
        description: "Pre-production backend project with its own Vercel environment and database.",
        env: {
          ledgerBaseUrl: "https://clawhouse-backend-staging.vercel.app"
        }
      },
      production: {
        label: "Production",
        branch: "main",
        description: "Production backend project. Use with production credentials only when you intend to touch live data.",
        env: {
          ledgerBaseUrl: "https://clawhouse-backend-prod.vercel.app"
        }
      }
    };

    const environmentOwnedKeys = new Set([
      "ledgerBaseUrl",
      "nearRpcUrl",
      "contractId",
      "nearNetworkId"
    ]);

    function pruneObsoleteEnv(env) {
      const next = { ...env };
      for (const key of obsoleteEnvKeys) delete next[key];
      return next;
    }

    function envProfileIds() {
      return Object.keys(environmentProfiles);
    }

    function normalizeEnvProfileId(profileId) {
      return envProfileIds().includes(profileId) ? profileId : "local";
    }

    function defaultEnvForProfile(profileId) {
      const profile = environmentProfiles[normalizeEnvProfileId(profileId)];
      return { ...defaultEnv, ...profile.env };
    }

    function migrateEnvProfiles(persistedState) {
      const savedProfiles = persistedState.envProfiles && typeof persistedState.envProfiles === "object"
        ? persistedState.envProfiles
        : {};
      const profiles = {};
      for (const profileId of envProfileIds()) {
        profiles[profileId] = {
          ...defaultEnvForProfile(profileId),
          ...pruneObsoleteEnv(savedProfiles[profileId] || {}),
          testUserPrivateKey: ""
        };
      }
      if (!Object.keys(savedProfiles).length && persistedState.env) {
        profiles.local = {
          ...defaultEnvForProfile("local"),
          ...pruneObsoleteEnv(persistedState.env),
          testUserPrivateKey: ""
        };
      }
      return profiles;
    }

    function migrateEncryptedEnvProfiles(persistedState) {
      const savedProfiles = persistedState.encryptedEnvProfiles && typeof persistedState.encryptedEnvProfiles === "object"
        ? persistedState.encryptedEnvProfiles
        : {};
      const profiles = {};
      for (const profileId of envProfileIds()) {
        profiles[profileId] = { ...(savedProfiles[profileId] || {}) };
      }
      if (!Object.keys(savedProfiles).length && persistedState.encryptedEnv) {
        profiles.local = { ...persistedState.encryptedEnv };
      }
      return profiles;
    }

    const persisted = loadState();
    const activeEnvProfile = normalizeEnvProfileId(persisted.activeEnvProfile);
    const envProfiles = migrateEnvProfiles(persisted);
    const state = {
      spec: null,
      activeFlow: 0,
      activeStep: 0,
      activeTab: persisted.activeTab || "params",
      responseTab: persisted.responseTab || "body",
      envOpen: persisted.envOpen || false,
      filter: "",
      activeEnvProfile,
      envProfiles,
      env: { ...envProfiles[activeEnvProfile], testUserPrivateKey: "" },
      encryptedEnvProfiles: migrateEncryptedEnvProfiles(persisted),
      collapsedFlows: persisted.collapsedFlows || {},
      accessFilter: persisted.accessFilter || "all",
      vars: persisted.vars || {},
      inputs: persisted.inputs || {},
      requestTemplates: persisted.requestTemplates || {},
      lastResult: null,
      lastDebugPacket: null
    };

    const tabs = [
      { id: "params", label: "Params" },
      { id: "headers", label: "Headers" },
      { id: "body", label: "Body / Args" },
      { id: "vars", label: "Vars" },
      { id: "preview", label: "Preview" }
    ];

    const responseTabDefs = [
      { id: "body", label: "Body" },
      { id: "vars", label: "Vars" },
      { id: "runner", label: "Runner" },
      { id: "streams", label: "Streams" },
      { id: "full", label: "Full" }
    ];

    const accessFilterDefs = [
      { id: "all", label: "All" },
      { id: "public", label: "Public" },
      { id: "protected", label: "Protected" }
    ];

    const $ = (id) => document.getElementById(id);
    const autoFillInFlight = new Map();
    let autoFillTimer = null;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        return {};
      }
    }

    function persist() {
      writePersistedState();
      queuePrivateKeyEncryption();
    }

    function writePersistedState() {
      updateActiveEnvProfile();
      localStorage.setItem(storageKey, JSON.stringify({
        activeTab: state.activeTab,
        responseTab: state.responseTab,
        envOpen: state.envOpen,
        activeEnvProfile: state.activeEnvProfile,
        envProfiles: state.envProfiles,
        encryptedEnvProfiles: state.encryptedEnvProfiles,
        collapsedFlows: state.collapsedFlows,
        accessFilter: currentAccessFilter(),
        vars: state.vars,
        inputs: state.inputs,
        requestTemplates: state.requestTemplates
      }));
    }

    function persistableEnv(env = state.env) {
      const next = { ...env };
      next.testUserPrivateKey = "";
      return next;
    }

    function updateActiveEnvProfile() {
      state.envProfiles[state.activeEnvProfile] = persistableEnv();
    }

    function activeEnvironmentProfile() {
      return environmentProfiles[state.activeEnvProfile] || environmentProfiles.local;
    }

    function activeEncryptedEnv() {
      state.encryptedEnvProfiles[state.activeEnvProfile] ||= {};
      return state.encryptedEnvProfiles[state.activeEnvProfile];
    }

    function displayEnv() {
      const next = { ...state.env };
      if (next.testUserPrivateKey) next.testUserPrivateKey = "[not shown]";
      return next;
    }

    let privateKeyEncryptionTimer = null;
    const lastPrivateKeyForEncryption = {};

    function queuePrivateKeyEncryption() {
      const privateKey = state.env.testUserPrivateKey || "";
      const profileId = state.activeEnvProfile;
      if (!privateKey || privateKey === lastPrivateKeyForEncryption[profileId]) return;
      if (privateKeyEncryptionTimer) clearTimeout(privateKeyEncryptionTimer);
      privateKeyEncryptionTimer = setTimeout(() => {
        encryptPrivateKey(privateKey, profileId);
      }, 200);
    }

    async function encryptPrivateKey(privateKey, profileId) {
      try {
        const response = await fetch("/crypto/encrypt", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ value: privateKey })
        });
        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "Private key encryption failed");
        if (state.activeEnvProfile === profileId && state.env.testUserPrivateKey !== privateKey) return;
        state.encryptedEnvProfiles[profileId] ||= {};
        state.encryptedEnvProfiles[profileId].testUserPrivateKey = result.ciphertext;
        lastPrivateKeyForEncryption[profileId] = privateKey;
        writePersistedState();
      } catch (error) {
        console.warn(error);
      }
    }

    async function restoreEncryptedEnv() {
      const profileId = state.activeEnvProfile;
      const ciphertext = activeEncryptedEnv().testUserPrivateKey;
      if (!ciphertext) return;
      try {
        const response = await fetch("/crypto/decrypt", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ ciphertext })
        });
        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "Private key decrypt failed");
        state.env.testUserPrivateKey = result.value || "";
        lastPrivateKeyForEncryption[profileId] = state.env.testUserPrivateKey;
      } catch (error) {
        console.warn(error);
      }
    }

    async function switchEnvironmentProfile(profileId) {
      const nextProfileId = normalizeEnvProfileId(profileId);
      if (nextProfileId === state.activeEnvProfile) return;
      updateActiveEnvProfile();
      state.activeEnvProfile = nextProfileId;
      state.env = { ...state.envProfiles[nextProfileId], testUserPrivateKey: "" };
      await restoreEncryptedEnv();
      render();
      showToast(`${activeEnvironmentProfile().label} environment selected`);
    }

    function activeFlow() {
      return state.spec.flows[state.activeFlow];
    }

    function activeStep() {
      return activeFlow().steps[state.activeStep];
    }

    function normalizeSelection() {
      const flows = Array.isArray(state.spec?.flows) ? state.spec.flows : [];
      if (!flows.length) {
        state.activeFlow = 0;
        state.activeStep = 0;
        return;
      }
      if (state.activeFlow < 0 || state.activeFlow >= flows.length) {
        state.activeFlow = 0;
      }
      const steps = Array.isArray(flows[state.activeFlow]?.steps) ? flows[state.activeFlow].steps : [];
      if (state.activeStep < 0 || state.activeStep >= steps.length) {
        state.activeStep = 0;
      }
      if (!tabs.some((tab) => tab.id === state.activeTab)) {
        state.activeTab = "params";
      }
    }

    function currentInputs(step = activeStep()) {
      const defaults = step.inputs || {};
      const fillDefaultsWhenEmpty = new Set(step.fillDefaultsWhenEmpty || []);
      state.inputs[step.id] ||= {};
      for (const [key, value] of Object.entries(defaults)) {
        if (
          !(key in state.inputs[step.id])
          || (fillDefaultsWhenEmpty.has(key) && state.inputs[step.id][key] === "" && value !== "")
        ) {
          state.inputs[step.id][key] = value;
        }
      }
      return state.inputs[step.id];
    }

    function findStepById(stepId) {
      for (const flow of state.spec.flows) {
        for (const step of flow.steps) {
          if (step.id === stepId) return step;
        }
      }
      return null;
    }

    function isPendingStep(step = activeStep()) {
      return step.type === "pending" || step.status === "未完成" || step.implemented === false;
    }

    function pendingReason(step = activeStep()) {
      return step.pendingReason || step.description || "This acceptance step is not implemented yet.";
    }

    function methodLabel(step = activeStep()) {
      if (isPendingStep(step)) return "未完成";
      if (step.type === "http") return step.method || "GET";
      if (step.type === "near-view") return "VIEW";
      return "SCRIPT";
    }

    function methodClass(step = activeStep()) {
      if (isPendingStep(step)) return "todo";
      return methodLabel(step).toLowerCase();
    }

    function stepAccess(step) {
      if (step.access === "public" || step.access === "protected") return step.access;
      return "";
    }

    function accessLabel(step) {
      const access = stepAccess(step);
      if (access === "public") return "Public";
      if (access === "protected") return "Protected";
      return "";
    }

    function currentAccessFilter() {
      const selected = state.accessFilter;
      if (selected === "public" || selected === "protected") return selected;
      return "all";
    }

    function matchesSidebarFilters(flow, step, needle) {
      const accessFilter = currentAccessFilter();
      if (accessFilter !== "all" && stepAccess(step) !== accessFilter) return false;
      if (!needle) return true;
      return `${flow.name} ${step.name} ${step.id} ${step.type} ${step.access || ""}`.toLowerCase().includes(needle);
    }

    function sidebarSteps(flow, flowIndex, needle = state.filter.trim().toLowerCase()) {
      return flow.steps
        .map((step, stepIndex) => ({ step, stepIndex }))
        .filter(({ step }) => matchesSidebarFilters(flow, step, needle));
    }

    function firstVisibleStepRef() {
      const needle = state.filter.trim().toLowerCase();
      for (let flowIndex = 0; flowIndex < state.spec.flows.length; flowIndex += 1) {
        const step = sidebarSteps(state.spec.flows[flowIndex], flowIndex, needle)[0];
        if (step) return { flowIndex, stepIndex: step.stepIndex };
      }
      return null;
    }

    function ensureActiveStepVisible() {
      const flow = state.spec.flows[state.activeFlow];
      if (!flow) return;
      if (sidebarSteps(flow, state.activeFlow).some(({ stepIndex }) => stepIndex === state.activeStep)) return;
      const next = firstVisibleStepRef();
      if (!next) return;
      state.activeFlow = next.flowIndex;
      state.activeStep = next.stepIndex;
    }

    function renderAccessFilter() {
      const activeFilter = currentAccessFilter();
      const counts = { all: 0, public: 0, protected: 0 };
      for (const flow of state.spec.flows) {
        for (const step of flow.steps) {
          counts.all += 1;
          const access = stepAccess(step);
          if (access) counts[access] += 1;
        }
      }
      $("accessFilter").innerHTML = accessFilterDefs.map((filter) => `
        <button
          type="button"
          class="access-filter-button ${activeFilter === filter.id ? "active" : ""}"
          data-access-filter="${escapeAttr(filter.id)}"
        >${escapeHtml(filter.label)} ${escapeHtml(String(counts[filter.id]))}</button>
      `).join("");

      document.querySelectorAll("[data-access-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          state.accessFilter = button.dataset.accessFilter || "all";
          ensureActiveStepVisible();
          render();
        });
      });
    }

    function runnerPath(step = activeStep()) {
      if (isPendingStep(step)) return "";
      if (step.type === "http") return "/run/http";
      if (step.type === "near-view") return "/run/near-view";
      return "/run/script";
    }

    function runnerUrl(step = activeStep()) {
      if (isPendingStep(step)) return "";
      return `${location.origin}${runnerPath(step)}`;
    }

    function requestTemplate(step = activeStep()) {
      if (state.requestTemplates[step.id] !== undefined) return state.requestTemplates[step.id];
      if (isPendingStep(step)) return pendingReason(step);
      if (step.type === "http") return step.url || "";
      if (step.type === "near-view") return `${step.contractId || ""} :: ${step.methodName || ""}`;
      return `${step.command || ""} ${(step.args || []).join(" ")}`;
    }

    function allVars(step = activeStep()) {
      const vars = { ...state.env, ...state.vars };
      for (const [key, value] of Object.entries(currentInputs(step))) {
        if (value !== undefined && value !== null && value !== "") {
          vars[key] = value;
        }
      }
      for (const key of environmentOwnedKeys) {
        if (key in state.env) vars[key] = state.env[key] ?? "";
      }
      return vars;
    }

    function inputDisplayValue(key, value) {
      if (environmentOwnedKeys.has(key) && key in state.env) {
        return String(state.env[key] ?? "");
      }
      if (value === undefined || value === null || value === "") {
        const fallback = state.vars[key] ?? state.env[key];
        if (fallback !== undefined && fallback !== null) return String(fallback);
      }
      return String(value ?? "");
    }

    function inputLabel(step, key) {
      const flowLabels = activeFlow()?.inputLabels || {};
      const stepLabels = step.inputLabels || {};
      return String(stepLabels[key] || flowLabels[key] || key);
    }

    function inputLabelList(step, keys) {
      return keys.map((key) => inputLabel(step, key)).join(", ");
    }

    function templateVars(value) {
      const keys = new Set();
      const visit = (item) => {
        if (typeof item === "string") {
          for (const match of item.matchAll(/\{\{([^}]+)\}\}/g)) {
            const key = match[1]?.trim();
            if (key) keys.add(key);
          }
          return;
        }
        if (Array.isArray(item)) {
          item.forEach(visit);
          return;
        }
        if (item && typeof item === "object") {
          Object.values(item).forEach(visit);
        }
      };
      visit(value);
      return keys;
    }

    function stepInputKeys(inputs) {
      return Object.keys(inputs).filter((key) => !environmentOwnedKeys.has(key));
    }

    function inputKeysFrom(step, keys) {
      const inputs = currentInputs(step);
      return stepInputKeys(inputs).filter((key) => keys.has(key));
    }

    function headerInputKeys(step) {
      return inputKeysFrom(step, templateVars(step.headers || {}));
    }

    function targetTemplateKeys(step) {
      const keys = new Set();
      if (step.type === "http") {
        templateVars(requestTemplate(step)).forEach((key) => keys.add(key));
      }
      if (step.type === "near-view") {
        templateVars(step.contractId || "").forEach((key) => keys.add(key));
        templateVars(step.methodName || "").forEach((key) => keys.add(key));
      }
      if (step.type === "script") {
        templateVars(step.command || "").forEach((key) => keys.add(key));
        templateVars(step.cwd || "").forEach((key) => keys.add(key));
      }
      return keys;
    }

    function targetInputKeys(step) {
      return inputKeysFrom(step, targetTemplateKeys(step));
    }

    function bodyInputKeys(step) {
      if (step.type === "http") return inputKeysFrom(step, templateVars(step.body));
      if (step.type === "near-view") return inputKeysFrom(step, templateVars(step.args || {}));
      if (step.type === "script") {
        const inputs = currentInputs(step);
        const targetVars = new Set(targetInputKeys(step));
        return stepInputKeys(inputs).filter((key) => !targetVars.has(key));
      }
      return [];
    }

    function paramsInputKeys(step) {
      const inputs = currentInputs(step);
      const targetVars = new Set(targetInputKeys(step));
      const headerVars = new Set(headerInputKeys(step));
      const bodyVars = new Set(bodyInputKeys(step));
      return stepInputKeys(inputs).filter((key) => {
        if (targetVars.has(key)) return true;
        return !headerVars.has(key) && !bodyVars.has(key);
      });
    }

    function interpolate(value, vars) {
      if (typeof value === "string") {
        return value.replace(/\{\{([^}]+)\}\}/g, (_, key) => {
          const value = vars[key.trim()];
          return value === undefined || value === null ? "" : String(value);
        });
      }
      if (Array.isArray(value)) return value.map((item) => interpolate(item, vars));
      if (value && typeof value === "object") {
        return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, interpolate(item, vars)]));
      }
      return value;
    }

    function getPath(source, path) {
      return path.split(".").reduce((acc, key) => {
        if (acc === undefined || acc === null) return undefined;
        return acc[key];
      }, source);
    }

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function missingTargetValues(step) {
      const vars = allVars(step);
      const inputs = currentInputs(step);
      const missingEnv = [];
      const missingInputs = [];
      for (const key of targetTemplateKeys(step)) {
        if (hasValue(vars[key])) continue;
        if (environmentOwnedKeys.has(key)) {
          missingEnv.push(key);
        } else if (key in inputs) {
          missingInputs.push(key);
        }
      }
      return { missingEnv, missingInputs };
    }

    function ensureTargetValues(step) {
      const missing = missingTargetValues(step);
      if (missing.missingEnv.length) {
        throw new Error(`Missing environment value: ${missing.missingEnv.join(", ")}. Open Environment and fill it for this target.`);
      }
      if (missing.missingInputs.length) {
        throw new Error(`Missing URL/path input: ${inputLabelList(step, missing.missingInputs)}. Fill the field or run the upstream step that extracts it.`);
      }
    }

    function autoFillRules(step = activeStep()) {
      return Array.isArray(step.autoFill) ? step.autoFill : [];
    }

    function queueAutoFill() {
      if (!state.spec || !autoFillRules(activeStep()).length) return;
      if (autoFillTimer) clearTimeout(autoFillTimer);
      autoFillTimer = setTimeout(() => {
        autoFillTimer = null;
        applyAutoFillRules(activeStep()).catch((error) => {
          console.warn(error);
        });
      }, 200);
    }

    async function ensureAutoFillForStep(step) {
      if (!autoFillRules(step).length) return;
      const summary = await applyAutoFillRules(step);
      const missing = autoFillRules(step)
        .filter((rule) => !hasValue(currentInputs(step)[rule.input]))
        .map((rule) => rule.input);
      if (!missing.length) return;
      const detail = [...summary.errors, ...summary.skipped].filter(Boolean).join(" ");
      throw new Error(
        `Could not auto-fill ${missing.join(", ")}. Run the quote step first or enter the value manually.${detail ? ` ${detail}` : ""}`
      );
    }

    async function applyAutoFillRules(step) {
      const summary = { changed: false, errors: [], skipped: [] };
      for (const rule of autoFillRules(step)) {
        const result = await applyAutoFillRule(step, rule);
        summary.changed = summary.changed || result.changed;
        if (result.error) summary.errors.push(result.error);
        if (result.skipped) summary.skipped.push(result.skipped);
      }
      if (summary.changed) {
        renderRequest();
        renderVars();
        if (state.activeTab === "preview") renderPreview(step);
        persist();
      }
      return summary;
    }

    async function applyAutoFillRule(step, rule) {
      const targetInputs = currentInputs(step);
      if (!rule.input || hasValue(targetInputs[rule.input])) {
        return { changed: false };
      }

      const sourceStep = findStepById(rule.stepId);
      if (!sourceStep) {
        return { changed: false, error: `Auto-fill source step not found: ${rule.stepId}` };
      }

      const vars = allVars(step);
      const missingInputs = (rule.requiredInputs || []).filter((key) => !hasValue(vars[key]));
      if (missingInputs.length) {
        return { changed: false, skipped: `Waiting for ${missingInputs.join(", ")} before auto-fill.` };
      }

      const flightKey = `${step.id}:${rule.input}:${rule.stepId}:${(rule.requiredInputs || []).map((key) => vars[key]).join(":")}`;
      if (!autoFillInFlight.has(flightKey)) {
        autoFillInFlight.set(
          flightKey,
          runAutoFillSource(step, rule, sourceStep, vars).finally(() => {
            autoFillInFlight.delete(flightKey);
          })
        );
      }
      return autoFillInFlight.get(flightKey);
    }

    async function runAutoFillSource(step, rule, sourceStep, vars) {
      const sourceInputs = { ...(sourceStep.inputs || {}), ...(state.inputs[sourceStep.id] || {}) };
      for (const key of Object.keys(sourceInputs)) {
        if (hasValue(vars[key])) sourceInputs[key] = String(vars[key]);
      }

      const response = await fetch(runnerPath(sourceStep), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          stepId: sourceStep.id,
          env: state.env,
          inputs: sourceInputs,
          vars: state.vars
        })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        return { changed: false, error: `Auto-fill ${rule.input} failed from ${sourceStep.name}.` };
      }

      const value = getPath({ response: result }, rule.source || "");
      if (!hasValue(value)) {
        return { changed: false, error: `Auto-fill ${rule.input} did not return ${rule.source}.` };
      }

      const targetInputs = currentInputs(step);
      if (hasValue(targetInputs[rule.input])) {
        return { changed: false };
      }

      targetInputs[rule.input] = String(value);
      state.vars[rule.input] = String(value);
      document.querySelectorAll("[data-input]").forEach((input) => {
        if (input.dataset.input === rule.input) input.value = String(value);
      });
      showToast(`Auto-filled ${rule.input}`);
      return { changed: true };
    }

    function resolvedTarget(step = activeStep()) {
      if (isPendingStep(step)) return `未完成: ${pendingReason(step)}`;
      const vars = allVars(step);
      if (step.type === "http") return interpolate(requestTemplate(step), vars);
      if (step.type === "near-view") {
        const rpc = vars.nearRpcUrl || "";
        const contract = interpolate(step.contractId || "", vars);
        const method = interpolate(step.methodName || "", vars);
        return `${rpc} -> ${contract}.${method}`;
      }
      const command = step.command || "";
      const args = interpolate(step.args || [], vars);
      const cwd = interpolate(step.cwd || "", vars);
      return `${cwd} $ ${[command, ...args].join(" ")}`;
    }

    function previewPayload(step = activeStep()) {
      if (isPendingStep(step)) {
        return {
          status: "未完成",
          runnable: false,
          reason: pendingReason(step)
        };
      }
      const vars = allVars(step);
      if (step.type === "http") {
        return {
          target: runnerPath(step),
          method: methodLabel(step),
          url: interpolate(requestTemplate(step), vars),
          headers: interpolate(step.headers || {}, vars),
          body: interpolate(step.body, vars)
        };
      }
      if (step.type === "near-view") {
        return {
          target: runnerPath(step),
          rpcUrl: vars.nearRpcUrl,
          contractId: interpolate(step.contractId, vars),
          methodName: interpolate(step.methodName, vars),
          args: interpolate(step.args || {}, vars)
        };
      }
      return {
        target: runnerPath(step),
        stepId: step.id,
        command: step.command,
        args: interpolate(step.args || [], vars),
        cwd: interpolate(step.cwd, vars)
      };
    }

    function render() {
      renderAccessFilter();
      renderSidebar();
      renderTopbar();
      renderRequest();
      renderTabs();
      renderVars();
      persist();
      queueAutoFill();
    }

    function renderSidebar() {
      const needle = state.filter.trim().toLowerCase();
      $("flowList").innerHTML = state.spec.flows.map((flow, flowIndex) => {
        const flowKey = flowCollapseKey(flow, flowIndex);
        const stepsId = `flow-steps-${flowIndex}`;
        const hasActiveFilter = Boolean(needle) || currentAccessFilter() !== "all";
        const isCollapsed = !hasActiveFilter && state.collapsedFlows[flowKey] === true;
        const steps = sidebarSteps(flow, flowIndex, needle);
        if (!steps.length) return "";
        const countLabel = steps.length === flow.steps.length ? String(flow.steps.length) : `${steps.length}/${flow.steps.length}`;
        return `
          <div class="flow-block">
            <button
              type="button"
              class="flow-button ${flowIndex === state.activeFlow ? "active" : ""}"
              data-flow-toggle="${flowIndex}"
              aria-expanded="${isCollapsed ? "false" : "true"}"
              aria-controls="${stepsId}"
            >
              <span class="flow-title">
                <span class="flow-chevron" aria-hidden="true"></span>
                <span class="flow-name">${escapeHtml(flow.name)}</span>
              </span>
              <span class="sidebar-label">${escapeHtml(countLabel)}</span>
            </button>
            <div id="${stepsId}" class="step-list" ${isCollapsed ? "hidden" : ""}>
              ${steps.map(({ step, stepIndex }) => `
                <button type="button" class="step-button ${flowIndex === state.activeFlow && stepIndex === state.activeStep ? "active" : ""}" data-flow="${flowIndex}" data-step="${stepIndex}">
                  <span class="verb ${escapeAttr(methodClass(step))}">${escapeHtml(methodLabel(step))}</span>
                  <strong>${escapeHtml(step.name)}</strong>
                  ${accessLabel(step) ? `<span class="access-tag ${escapeAttr(stepAccess(step))}">${escapeHtml(accessLabel(step))}</span>` : ""}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");

      document.querySelectorAll("[data-flow-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const flowIndex = Number(button.dataset.flowToggle);
          const flow = state.spec.flows[flowIndex];
          const flowKey = flowCollapseKey(flow, flowIndex);
          state.collapsedFlows[flowKey] = state.collapsedFlows[flowKey] !== true;
          renderSidebar();
          persist();
        });
      });

      document.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeFlow = Number(button.dataset.flow);
          state.activeStep = Number(button.dataset.step);
          render();
        });
      });
    }

    function flowCollapseKey(flow, flowIndex) {
      return flow.id || flow.name || String(flowIndex);
    }

    function renderTopbar() {
      const flow = activeFlow();
      const step = activeStep();
      const profile = activeEnvironmentProfile();
      $("crumbFlow").textContent = flow.name;
      $("crumbStep").textContent = step.name;
      $("workspacePill").textContent = profile.label;
      $("envDot").className = `env-dot ${escapeAttr(state.activeEnvProfile)}`;
      $("envSelect").innerHTML = envProfileIds().map((profileId) => {
        const optionProfile = environmentProfiles[profileId];
        return `<option value="${escapeAttr(profileId)}">${escapeHtml(optionProfile.label)}</option>`;
      }).join("");
      $("envSelect").value = state.activeEnvProfile;
      $("envDrawer").classList.toggle("open", state.envOpen);
      $("envProfileName").textContent = `${profile.label} Environment`;
      $("envProfileBranch").textContent = profile.branch;
      $("envProfileDescription").textContent = profile.description;
      $("envEditor").value = JSON.stringify(state.env, null, 2);
      $("varsEditor").value = JSON.stringify(state.vars, null, 2);
    }

    function renderRequest() {
      const flow = activeFlow();
      const step = activeStep();
      const method = methodLabel(step);
      const pending = isPendingStep(step);
      $("stepName").textContent = step.name;
      $("stepDescription").textContent = step.description || "No description has been added for this request yet.";
      $("stepType").textContent = `${flow.name} / ${step.id}`;
      $("methodSelect").innerHTML = `<option>${method}</option>`;
      $("methodSelect").disabled = pending;
      $("requestTarget").value = requestTemplate(step);
      $("requestTarget").readOnly = pending || step.type !== "http";
      $("requestTarget").classList.toggle("pending", pending);
      $("fireStep").disabled = pending;
      $("fireStep").textContent = pending ? "未完成" : "Send";
      $("requestPills").innerHTML = pending
        ? `<span class="pill pending">未完成</span>`
        : `
          <span class="pill">${step.type}</span>
          <span class="pill">${Object.keys(step.setVars || {}).length} extracts</span>
        `;
      $("responseTarget").textContent = pending
        ? resolvedTarget(step)
        : `Ready to send to ${resolvedTarget(step)}`;
    }

    function renderTabs() {
      $("tabs").innerHTML = tabs.map((tab) => `
        <button class="tab ${tab.id === state.activeTab ? "active" : ""}" data-tab="${tab.id}">${tab.label}</button>
      `).join("");

      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeTab = button.dataset.tab;
          renderTabs();
          persist();
        });
      });

      const step = activeStep();
      if (state.activeTab === "params") renderParams(step);
      if (state.activeTab === "headers") renderHeaders(step);
      if (state.activeTab === "body") renderBody(step);
      if (state.activeTab === "vars") renderVarsTab(step);
      if (state.activeTab === "preview") renderPreview(step);
    }

    function renderInputFields(step, keys, emptyText) {
      const inputs = currentInputs(step);
      return keys.length ? `
        <div class="fields params-fields">
          ${keys.map((key) => `
            <div class="kv-row">
              <input class="input" value="${escapeAttr(inputLabel(step, key))}" title="${escapeAttr(key)}" readonly />
              <input class="input" data-input="${escapeAttr(key)}" value="${escapeAttr(inputDisplayValue(key, inputs[key]))}" />
            </div>
          `).join("")}
        </div>
      ` : `<div class="empty">${escapeHtml(emptyText)}</div>`;
    }

    function bindInputFields(step, onInput = () => {}) {
      document.querySelectorAll("[data-input]").forEach((input) => {
        input.addEventListener("input", () => {
          const key = input.dataset.input;
          currentInputs(step)[key] = input.value;
          if (environmentOwnedKeys.has(key)) {
            state.env[key] = input.value;
          }
          renderRequest();
          onInput();
          if (state.activeTab === "preview") renderPreview(step);
          persist();
          queueAutoFill();
        });
      });
    }

    function renderParams(step) {
      $("tabBody").innerHTML = renderInputFields(
        step,
        paramsInputKeys(step),
        "No URL/path or unclassified inputs for this step."
      );
      bindInputFields(step);
    }

    function renderHeaders(step) {
      if (step.type !== "http") {
        $("tabBody").innerHTML = `<div class="empty">No headers for this step.</div>`;
        return;
      }
      const keys = headerInputKeys(step);
      const headers = interpolate(step.headers || {}, allVars(step));
      const preview = Object.keys(headers).length
        ? `<pre id="headersPreview" class="light-code">${escapeHtml(JSON.stringify(headers, null, 2))}</pre>`
        : "";
      $("tabBody").innerHTML = `
        ${renderInputFields(step, keys, "No editable header inputs for this step.")}
        ${preview}
      `;
      bindInputFields(step, () => {
        const previewElement = document.getElementById("headersPreview");
        if (previewElement) previewElement.textContent = JSON.stringify(interpolate(step.headers || {}, allVars(step)), null, 2);
      });
    }

    function bodyPayload(step) {
      if (isPendingStep(step)) {
        return {
          status: "未完成",
          reason: pendingReason(step)
        };
      }
      if (step.type === "http") return interpolate(step.body, allVars(step));
      if (step.type === "near-view") return interpolate(step.args || {}, allVars(step));
      if (step.type === "script") {
        return {
          command: step.command,
          args: interpolate(step.args || [], allVars(step)),
          cwd: interpolate(step.cwd, allVars(step))
        };
      }
      return undefined;
    }

    function renderBody(step) {
      const keys = bodyInputKeys(step);
      const payload = bodyPayload(step);
      const preview = payload === undefined
        ? ""
        : `<pre id="bodyPreview" class="light-code">${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
      $("tabBody").innerHTML = `
        ${renderInputFields(step, keys, "No editable body or argument inputs for this step.")}
        ${preview}
      `;
      bindInputFields(step, () => {
        const previewElement = document.getElementById("bodyPreview");
        const payload = bodyPayload(step);
        if (previewElement && payload !== undefined) previewElement.textContent = JSON.stringify(payload, null, 2);
      });
    }

    function renderVarsTab(step) {
      $("tabBody").innerHTML = `
        <div class="fields">
          <div class="field">
            <label>Runtime Variables</label>
            <textarea id="varsTabEditor" class="textarea">${escapeHtml(JSON.stringify(state.vars, null, 2))}</textarea>
          </div>
          <div class="field">
            <label>Variables Extracted By This Step</label>
            <pre class="light-code">${escapeHtml(JSON.stringify(step.setVars || {}, null, 2))}</pre>
          </div>
        </div>
      `;
      $("varsTabEditor").addEventListener("input", () => {
        try {
          state.vars = parseJsonObject($("varsTabEditor").value || "{}", "Runtime variables");
          renderRequest();
          renderVars();
          persist();
        } catch {
          // Keep editing local until valid JSON is restored.
        }
      });
    }

    function renderPreview(step) {
      const payload = previewPayload(step);
      const preview = {
        runner: {
          method: "POST",
          url: runnerUrl(step),
          payload: step.type === "script"
            ? { stepId: step.id, environment: state.activeEnvProfile, env: displayEnv(), inputs: currentInputs(), vars: state.vars }
            : payload
        },
        resolvedAction: payload
      };
      $("tabBody").innerHTML = `<pre class="light-code">${escapeHtml(JSON.stringify(preview, null, 2))}</pre>`;
    }

    function renderVars() {
      const entries = Object.entries(state.vars);
      const varCount = $("varCount");
      if (varCount) varCount.textContent = runtimeVarCountLabel(entries.length);
      const varsPanel = $("vars");
      if (varsPanel) varsPanel.innerHTML = renderRuntimeVarCards(entries);
      if ($("varsEditor")) $("varsEditor").value = JSON.stringify(state.vars, null, 2);
      const varsTabEditor = $("varsTabEditor");
      if (varsTabEditor && document.activeElement !== varsTabEditor) {
        varsTabEditor.value = JSON.stringify(state.vars, null, 2);
      }
    }

    function runtimeVarCountLabel(count) {
      return `${count} runtime vars`;
    }

    function renderRuntimeVarCards(entries = Object.entries(state.vars)) {
      return entries.length ? entries.map(([key, value]) => `
        <div class="var-card">
          <div class="var-key">${escapeHtml(key)}</div>
          <div class="var-value">${escapeHtml(String(value))}</div>
        </div>
      `).join("") : `<div class="empty">No runtime variables extracted yet.</div>`;
    }

    function renderRuntimeVarsPanel() {
      const entries = Object.entries(state.vars);
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>Runtime variables</span>
            <span id="varCount" class="result-panel-meta">${escapeHtml(runtimeVarCountLabel(entries.length))}</span>
          </div>
          <div id="vars" class="vars-grid response-vars-grid">${renderRuntimeVarCards(entries)}</div>
        </div>
      `;
    }

    function syncEditors() {
      try {
        state.env = parseJsonObject($("envEditor").value || "{}", "Environment");
        if (!state.env.testUserPrivateKey) {
          delete activeEncryptedEnv().testUserPrivateKey;
          lastPrivateKeyForEncryption[state.activeEnvProfile] = "";
        }
        state.vars = parseJsonObject($("varsEditor").value || "{}", "Runtime variables");
        renderRequest();
        renderVars();
        if (state.activeTab === "preview") renderPreview(activeStep());
        persist();
        queueAutoFill();
        return true;
      } catch (error) {
        state.lastDebugPacket = null;
        renderResult({ ok: false, error: error.message }, new Date().toLocaleTimeString(), "Invalid JSON");
        return false;
      }
    }

    function parseJsonObject(value, label) {
      const parsed = JSON.parse(value);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        throw new Error(`${label} must be a JSON object`);
      }
      return parsed;
    }

    let toastTimer = null;

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function applySetVars(step, result) {
      const mappings = step.setVars || {};
      const source = {
        response: result,
        inputs: currentInputs(),
        env: state.env,
        vars: state.vars
      };
      for (const [name, path] of Object.entries(mappings)) {
        const value = getPath(source, path);
        if (value !== undefined && value !== null && value !== "") {
          state.vars[name] = typeof value === "object" ? JSON.stringify(value) : String(value);
        }
      }
    }

    function renderResult(result, startedAt, targetLabel) {
      const ok = Boolean(result.ok);
      $("resultMeta").innerHTML = `
        <span class="pill ${ok ? "ok" : "fail"}">${ok ? "success" : "failed"}</span>
        <span class="pill">started ${escapeHtml(startedAt)}</span>
        ${result.durationMs !== undefined ? `<span class="pill">${escapeHtml(String(result.durationMs))} ms</span>` : ""}
        ${result.status ? `<span class="pill">status ${result.status}</span>` : ""}
        ${result.exitCode !== undefined ? `<span class="pill">exit ${result.exitCode}</span>` : ""}
      `;
      $("resultBox").innerHTML = renderReadableResult(result, targetLabel);
      $("responseTarget").textContent = targetLabel;
      $("copyDebugContext").disabled = !state.lastDebugPacket;
    }

    function renderReadableResult(result, targetLabel) {
      const ok = Boolean(result.ok);
      const parsedJson = result.json ?? parseJsonText(result.stdout);
      const stdout = typeof result.stdout === "string" ? result.stdout : "";
      const stderr = typeof result.stderr === "string" ? result.stderr : "";
      const text = typeof result.text === "string" ? result.text : "";
      let bodyContent = JSON.stringify(result, null, 2);
      let bodyMeta = "Runner JSON";
      let bodySource = "runner";

      if (parsedJson !== null && parsedJson !== undefined) {
        bodyContent = JSON.stringify(parsedJson, null, 2);
        bodyMeta = "Pretty JSON";
        bodySource = "parsed";
      } else if (text.trim()) {
        bodyContent = text;
        bodyMeta = "Raw text";
        bodySource = "text";
      } else if (stdout.trim()) {
        bodyContent = stdout;
        bodyMeta = "Raw stdout";
        bodySource = "stdout";
      }

      const runnerMeta = Object.fromEntries([
        ["target", targetLabel],
        ["command", formatCommand(result.command)],
        ["workingDir", result.cwd]
      ].filter(([, value]) => value !== undefined && value !== null && value !== ""));
      const activeTab = normalizedResponseTab();
      const streamBlocks = [
        stdout.trim() ? resultPanelBlock("Raw stdout", stdout, "Stream") : "",
        stderr.trim() ? resultPanelBlock("Raw stderr", stderr, "Stream") : "",
        text.trim() && bodySource !== "text" && text !== stdout
          ? resultPanelBlock("Raw response text", text, "Text")
          : ""
      ].filter(Boolean);
      const bodyPanel = `
        <div class="result-summary ${ok ? "ok" : "fail"}">
          <div class="result-heading">
            <div class="result-title">${ok ? "Step completed" : "Step failed"}</div>
          </div>
          <div class="result-message">${escapeHtml(resultMessage(result, parsedJson, ok))}</div>
        </div>
        ${resultPanelBlock("Body", bodyContent, bodyMeta)}
      `;
      const runnerPanel = Object.keys(runnerMeta).length
        ? resultPanelBlock("Runner metadata", JSON.stringify(runnerMeta, null, 2), "JSON")
        : `<div class="stream-empty">No runner metadata returned.</div>`;
      const streamsPanel = streamBlocks.length
        ? streamBlocks.join("")
        : `<div class="stream-empty">No stdout, stderr, or raw response stream returned.</div>`;
      const fullPanel = resultPanelBlock("Full runner response", JSON.stringify(result, null, 2), "Runner JSON");
      const varsPanel = renderRuntimeVarsPanel();

      return `
        <div class="response-console ${ok ? "ok" : "fail"}">
          <div class="response-console-bar">
            ${renderResponseTabs(activeTab)}
            <div class="response-metrics">
              <span class="metric">${escapeHtml(bodyMeta)}</span>
              <span class="metric">${escapeHtml(byteSize(bodyContent))}</span>
            </div>
          </div>
          ${responsePanel("body", activeTab, bodyPanel)}
          ${responsePanel("vars", activeTab, varsPanel)}
          ${responsePanel("runner", activeTab, runnerPanel)}
          ${responsePanel("streams", activeTab, streamsPanel)}
          ${responsePanel("full", activeTab, fullPanel)}
        </div>
      `;
    }

    function normalizedResponseTab() {
      if (!responseTabDefs.some((tab) => tab.id === state.responseTab)) {
        state.responseTab = "body";
      }
      return state.responseTab;
    }

    function renderResponseTabs(activeTab) {
      return `
        <div class="response-tabs" role="tablist" aria-label="Response panels">
          ${responseTabDefs.map((tab) => `
            <button
              type="button"
              class="response-tab ${tab.id === activeTab ? "active" : ""}"
              data-response-tab="${escapeAttr(tab.id)}"
              role="tab"
              aria-selected="${tab.id === activeTab ? "true" : "false"}"
            >${escapeHtml(tab.label)}</button>
          `).join("")}
        </div>
      `;
    }

    function responsePanel(id, activeTab, content) {
      return `
        <div class="response-panel" data-response-panel="${escapeAttr(id)}" role="tabpanel" ${id === activeTab ? "" : "hidden"}>
          ${content}
        </div>
      `;
    }

    function resultPanelBlock(title, content, meta) {
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>${escapeHtml(title)}</span>
            <span class="result-panel-meta">${escapeHtml(meta || "Raw")} · ${escapeHtml(byteSize(content))}</span>
          </div>
          ${resultCodeBlock(content)}
        </div>
      `;
    }

    function resultPlaceholderBlock(title, message, meta) {
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>${escapeHtml(title)}</span>
            <span class="result-panel-meta">${escapeHtml(meta || "waiting")}</span>
          </div>
          <div class="stream-empty small">${escapeHtml(message)}</div>
        </div>
      `;
    }

    function resultCodeBlock(content) {
      return `
        <div class="result-code">
          ${String(content ?? "").split("\n").map((line, index) => `
            <div class="code-line">
              <span class="code-line-number">${index + 1}</span>
              <span class="code-line-text">${escapeHtml(line || " ")}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderRunningResult(step, targetLabel) {
      const notes = Array.isArray(step.runningNotes) && step.runningNotes.length
        ? step.runningNotes
        : defaultRunningNotes(step);
      const activeTab = normalizedResponseTab();
      const runnerInfo = {
        status: "running",
        target: targetLabel,
        runnerUrl: runnerUrl(step),
        stepId: step.id,
        type: step.type,
        expectedWork: notes
      };
      const bodyPanel = `
        <div class="result-summary running">
          <div class="result-heading">
            <div class="result-title with-spinner">
              <span class="spinner" aria-hidden="true"></span>
              <span>Sending request</span>
            </div>
          </div>
          <div class="result-message">${escapeHtml(targetLabel)}</div>
        </div>
        ${resultPlaceholderBlock("Body", "Waiting for the response body. It will appear here in the same format after the runner returns.", "waiting")}
      `;
      return `
        <div class="response-console running">
          <div class="response-console-bar">
            ${renderResponseTabs(activeTab)}
            <div class="response-metrics">
              <span class="spinner" aria-hidden="true"></span>
              <span class="metric warn">Sending</span>
            </div>
          </div>
          ${responsePanel("body", activeTab, bodyPanel)}
          ${responsePanel("vars", activeTab, renderRuntimeVarsPanel())}
          ${responsePanel("runner", activeTab, resultPanelBlock("Runner metadata", JSON.stringify(runnerInfo, null, 2), "JSON"))}
          ${responsePanel("streams", activeTab, resultPlaceholderBlock("Streams", "Waiting for stdout, stderr, or raw text from the runner.", "waiting"))}
          ${responsePanel("full", activeTab, resultPlaceholderBlock("Full runner response", "Full runner response will appear here after completion.", "waiting"))}
        </div>
      `;
    }

    function byteSize(content) {
      const bytes = new TextEncoder().encode(String(content ?? "")).length;
      if (bytes < 1024) return `${bytes} B`;
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    function defaultRunningNotes(step) {
      if (step.type === "near-view") {
        return [
          "Calling a NEAR RPC view method.",
          "No private key, gas, or transaction is used.",
          "Waiting for the RPC response and parsing returned state."
        ];
      }
      if (step.type === "http") {
        return [
          "Sending the HTTP request to the configured backend.",
          "Waiting for the backend response.",
          "Parsing the response and extracting runtime variables."
        ];
      }
      return [
        "Starting the allowlisted local script.",
        "Waiting for the script to call its real backend, RPC, or chain target.",
        "Parsing stdout, stderr, and structured JSON output."
      ];
    }

    function resultMessage(result, parsedJson, ok) {
      const parsed = parsedJson && typeof parsedJson === "object" && !Array.isArray(parsedJson)
        ? parsedJson
        : null;
      const messages = [
        typeof result.error === "string" ? result.error : "",
        parsed && typeof parsed.error === "string" ? parsed.error : "",
        parsed && typeof parsed.nextStep === "string" ? parsed.nextStep : "",
        result.rpc?.error ? JSON.stringify(result.rpc.error) : ""
      ].filter(Boolean);
      if (messages.length) return messages.join("\n");
      if (ok) return "The runner returned a successful response.";
      return "The runner returned a failed response. The full command, streams, and raw payload are below.";
    }

    function formatCommand(command) {
      return Array.isArray(command) ? command.join(" ") : command || "";
    }

    function parseJsonText(value) {
      if (typeof value !== "string" || !value.trim()) return null;
      try {
        return JSON.parse(value);
      } catch {
        return null;
      }
    }

    async function fireStep() {
      if (state.envOpen && !syncEditors()) return;
      const flow = activeFlow();
      const step = activeStep();
      if (isPendingStep(step)) {
        showToast("This user-story step is marked 未完成.");
        return;
      }
      const target = runnerPath(step);
      const startedAt = new Date().toLocaleTimeString();
      const startedMs = performance.now();
      let targetLabel = `${methodLabel(step)} ${resolvedTarget(step)}`;
      let payload = null;

      $("fireStep").disabled = true;
      state.lastDebugPacket = null;
      $("copyDebugContext").disabled = true;

      try {
        await ensureAutoFillForStep(step);
        ensureTargetValues(step);
        const preview = previewPayload(step);
        targetLabel = `${methodLabel(step)} ${resolvedTarget(step)}`;
        payload = target === "/run/script"
          ? { stepId: step.id, env: state.env, inputs: currentInputs(), vars: state.vars }
          : preview;

        state.responseTab = "body";
        $("resultMeta").innerHTML = `<span class="pill warn">running</span><span class="pill">started ${startedAt}</span>`;
        $("resultBox").innerHTML = renderRunningResult(step, targetLabel);
        $("responseTarget").textContent = targetLabel;

        const response = await fetch(target, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.durationMs === undefined) {
          result.durationMs = Math.round(performance.now() - startedMs);
        }
        state.lastResult = result;
        state.lastDebugPacket = buildDebugPacket(flow, step, startedAt, targetLabel, payload, result);
        applySetVars(step, result);
        renderResult(result, startedAt, targetLabel);
        renderVars();
        if (state.activeTab === "preview") renderPreview(step);
      } catch (error) {
        const result = { ok: false, error: error.message, durationMs: Math.round(performance.now() - startedMs) };
        state.lastResult = result;
        state.lastDebugPacket = buildDebugPacket(
          flow,
          step,
          startedAt,
          targetLabel,
          payload || (target === "/run/script"
            ? { stepId: step.id, env: state.env, inputs: currentInputs(), vars: state.vars }
            : previewPayload(step)),
          result
        );
        renderResult(result, startedAt, targetLabel);
      } finally {
        $("fireStep").disabled = isPendingStep(activeStep());
        persist();
      }
    }

    function handleSendShortcut(event) {
      if (!event.metaKey || event.key !== "Enter" || $("fireStep").disabled) return;
      event.preventDefault();
      fireStep();
    }

    function applyResponseTabState() {
      const activeTab = normalizedResponseTab();
      $("resultBox").querySelectorAll("[data-response-tab]").forEach((button) => {
        const isActive = button.dataset.responseTab === activeTab;
        button.classList.toggle("active", isActive);
