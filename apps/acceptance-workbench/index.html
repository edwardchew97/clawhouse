          renderRequest();
          renderVars();
          persist();
        } catch {
          // Keep editing local until valid JSON is restored.
        }
      });
    }

    function renderPreview(step) {
      const payload = previewPayload(step);
      const preview = {
        runner: {
          method: "POST",
          url: runnerUrl(step),
          payload: step.type === "script"
            ? { stepId: step.id, environment: state.activeEnvProfile, env: displayEnv(), inputs: currentInputs(), vars: state.vars }
            : payload
        },
        resolvedAction: payload
      };
      $("tabBody").innerHTML = `<pre class="light-code">${escapeHtml(JSON.stringify(preview, null, 2))}</pre>`;
    }

    function renderVars() {
      const entries = Object.entries(state.vars);
      const varCount = $("varCount");
      if (varCount) varCount.textContent = runtimeVarCountLabel(entries.length);
      const varsPanel = $("vars");
      if (varsPanel) varsPanel.innerHTML = renderRuntimeVarCards(entries);
      if ($("varsEditor")) $("varsEditor").value = JSON.stringify(state.vars, null, 2);
      const varsTabEditor = $("varsTabEditor");
      if (varsTabEditor && document.activeElement !== varsTabEditor) {
        varsTabEditor.value = JSON.stringify(state.vars, null, 2);
      }
    }

    function runtimeVarCountLabel(count) {
      return `${count} runtime vars`;
    }

    function renderRuntimeVarCards(entries = Object.entries(state.vars)) {
      return entries.length ? entries.map(([key, value]) => `
        <div class="var-card">
          <div class="var-key">${escapeHtml(key)}</div>
          <div class="var-value">${escapeHtml(String(value))}</div>
        </div>
      `).join("") : `<div class="empty">No runtime variables extracted yet.</div>`;
    }

    function renderRuntimeVarsPanel(vars = state.vars) {
      const entries = Object.entries(vars);
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>Runtime variables</span>
            <span id="varCount" class="result-panel-meta">${escapeHtml(runtimeVarCountLabel(entries.length))}</span>
          </div>
          <div id="vars" class="vars-grid response-vars-grid">${renderRuntimeVarCards(entries)}</div>
        </div>
      `;
    }

    function renderActiveStepResponse() {
      const flow = activeFlow();
      const step = activeStep();
      if (isPendingStep(step)) {
        renderPendingStepResponse(flow, step);
        return;
      }
      const response = activeStepResponse();
      if (!response) {
        renderEmptyStepResponse();
        return;
      }
      state.responseTab = response.responseTab || "body";
      state.lastResult = response.result || null;
      state.lastDebugPacket = response.debugPacket || null;
      if (response.running) {
        $("resultMeta").innerHTML = `<span class="pill warn">running</span><span class="pill">started ${escapeHtml(response.startedAt)}</span>`;
        $("resultBox").innerHTML = renderRunningResult(step, response.targetLabel);
        $("responseTarget").textContent = response.targetLabel;
        $("copyDebugContext").disabled = true;
        return;
      }
      renderResult(response.result, response.startedAt, response.targetLabel, response.vars);
    }

    function renderEmptyStepResponse() {
      state.lastResult = null;
      state.lastDebugPacket = null;
      $("resultMeta").innerHTML = "";
      $("resultBox").innerHTML = `<div class="result-empty">No response yet.</div>`;
      $("copyDebugContext").disabled = true;
    }

    function syncEditors() {
      try {
        state.env = parseJsonObject($("envEditor").value || "{}", "Environment");
        const encryptedEnv = activeEncryptedEnv();
        const cache = encryptedEnvCache(state.activeEnvProfile);
        for (const key of encryptedEnvKeys) {
          if (!state.env[key]) {
            delete encryptedEnv[key];
            cache[key] = "";
          }
        }
        state.vars = parseJsonObject($("varsEditor").value || "{}", "Runtime variables");
        renderRequest();
        renderVars();
        if (state.activeTab === "preview") renderPreview(activeStep());
        persist();
        queueAutoFill();
        return true;
      } catch (error) {
        state.lastDebugPacket = null;
        renderResult({ ok: false, error: error.message }, new Date().toLocaleTimeString(), "Invalid JSON");
        return false;
      }
    }

    function parseJsonObject(value, label) {
      const parsed = JSON.parse(value);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        throw new Error(`${label} must be a JSON object`);
      }
      return parsed;
    }

    let toastTimer = null;

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function applyMappings(mappings, source, target) {
      for (const [name, path] of Object.entries(mappings)) {
        const value = getPath(source, path);
        if (value !== undefined && value !== null && value !== "") {
          target[name] = typeof value === "object" ? JSON.stringify(value) : String(value);
        }
      }
    }

    function workbenchAgentIdFromWalletAddress(value) {
      const suffix = String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 16);
      return suffix ? `workbench-agent-${suffix}` : "";
    }

    function applyDerivedMappings(mappings, source, target) {
      for (const [name, rule] of Object.entries(mappings)) {
        if (!rule || typeof rule !== "object") continue;
        const sourceValue = getPath(source, rule.source || "");
        let value = "";
        if (rule.kind === "workbenchAgentIdFromWalletAddress") {
          value = workbenchAgentIdFromWalletAddress(sourceValue);
        }
        if (hasValue(value)) target[name] = value;
      }
    }

    function applyClears(step) {
      const clearedInputs = {};
      for (const name of step.clearVars || []) {
        delete state.vars[name];
      }
      for (const [stepId, keys] of Object.entries(step.clearInputs || {})) {
        if (!Array.isArray(keys)) continue;
        for (const key of keys) {
          if (state.inputs[stepId]) delete state.inputs[stepId][key];
          clearedInputs[stepId] ||= [];
          clearedInputs[stepId].push(key);
          if (key === "ledgerBoardId") {
            delete state.vars.ledgerReadToken;
            const targetStep = findStepById(stepId);
            if (
              targetStep?.inputs
              && Object.prototype.hasOwnProperty.call(targetStep.inputs, "ledgerReadToken")
              && state.inputs[stepId]
            ) {
              delete state.inputs[stepId].ledgerReadToken;
            }
          }
        }
      }
      return clearedInputs;
    }

    function seedClearedInputsFromVars(clearedInputs) {
      for (const [stepId, keys] of Object.entries(clearedInputs || {})) {
        const step = findStepById(stepId);
        if (!step) continue;
        const inputKeys = new Set(Object.keys(step.inputs || {}));
        for (const key of keys) {
          if (!inputKeys.has(key) || !hasValue(state.vars[key])) continue;
          state.inputs[stepId] ||= {};
          state.inputs[stepId][key] = String(state.vars[key]);
        }
      }
    }

    function applySetVars(step, result) {
      const source = {
        response: result,
        inputs: currentInputs(),
        env: state.env,
        vars: state.vars
      };
      applyMappings(step.setVars || {}, source, state.vars);
      applyDerivedMappings(step.setDerivedVars || {}, source, state.vars);
    }

    function applySetEnv(step, result) {
      const source = {
        response: result,
        inputs: currentInputs(),
        env: state.env,
        vars: state.vars
      };
      applyMappings(step.setEnv || {}, source, state.env);
    }

    function resultForDisplay(result) {
      if (!result || typeof result !== "object" || Array.isArray(result)) return result;
      if (!result.envUpdates) return result;
      return {
        ...result,
        envUpdates: sanitizeSecrets(result.envUpdates)
      };
    }

    function renderResult(result, startedAt, targetLabel, vars = state.vars) {
      const ok = Boolean(result.ok);
      const pending = result.pending === true || result.status === "未完成";
      $("resultMeta").innerHTML = `
        <span class="pill ${ok ? "ok" : pending ? "warn" : "fail"}">${ok ? "success" : pending ? "未完成" : "failed"}</span>
        ${startedAt ? `<span class="pill">started ${escapeHtml(startedAt)}</span>` : ""}
        ${result.durationMs !== undefined ? `<span class="pill">${escapeHtml(String(result.durationMs))} ms</span>` : ""}
        ${result.status ? `<span class="pill">status ${result.status}</span>` : ""}
        ${result.exitCode !== undefined ? `<span class="pill">exit ${result.exitCode}</span>` : ""}
      `;
      $("resultBox").innerHTML = renderReadableResult(result, targetLabel, vars);
      $("responseTarget").textContent = targetLabel;
      $("copyDebugContext").disabled = !state.lastDebugPacket;
    }

    function renderReadableResult(result, targetLabel, vars = state.vars) {
      const ok = Boolean(result.ok);
      const parsedJson = result.json ?? parseJsonText(result.stdout);
      const parsedRecord = parsedJson && typeof parsedJson === "object" && !Array.isArray(parsedJson)
        ? parsedJson
        : null;
      const pending = result.pending === true || result.status === "未完成" || parsedRecord?.status === "未完成";
      const stdout = typeof result.stdout === "string" ? result.stdout : "";
      const stderr = typeof result.stderr === "string" ? result.stderr : "";
      const text = typeof result.text === "string" ? result.text : "";
      let bodyContent = JSON.stringify(result, null, 2);
      let bodyMeta = "Runner JSON";
      let bodySource = "runner";

      if (parsedJson !== null && parsedJson !== undefined) {
        bodyContent = JSON.stringify(parsedJson, null, 2);
        bodyMeta = "Pretty JSON";
        bodySource = "parsed";
      } else if (text.trim()) {
        bodyContent = text;
        bodyMeta = "Raw text";
        bodySource = "text";
      } else if (stdout.trim()) {
        bodyContent = stdout;
        bodyMeta = "Raw stdout";
        bodySource = "stdout";
      }

      const runnerMeta = Object.fromEntries([
        ["target", targetLabel],
        ["command", formatCommand(result.command)],
        ["workingDir", result.cwd]
      ].filter(([, value]) => value !== undefined && value !== null && value !== ""));
      const activeTab = normalizedResponseTab();
      const streamBlocks = [
        stdout.trim() ? resultPanelBlock("Raw stdout", stdout, "Stream") : "",
        stderr.trim() ? resultPanelBlock("Raw stderr", stderr, "Stream") : "",
        text.trim() && bodySource !== "text" && text !== stdout
          ? resultPanelBlock("Raw response text", text, "Text")
          : ""
      ].filter(Boolean);
      const summaryClass = ok ? "ok" : pending ? "pending" : "fail";
      const summaryTitle = ok ? "Step completed" : pending ? "Step not implemented" : "Step failed";
      const bodyPanel = `
        <div class="result-summary ${summaryClass}">
          <div class="result-heading">
            <div class="result-title">${summaryTitle}</div>
          </div>
          <div class="result-message">${escapeHtml(resultMessage(result, parsedJson, ok))}</div>
        </div>
        ${bodySource === "parsed"
          ? resultJsonPanelBlock("Body", parsedJson, bodyMeta, bodyContent)
          : resultPanelBlock("Body", bodyContent, bodyMeta)}
      `;
      const runnerPanel = Object.keys(runnerMeta).length
        ? resultPanelBlock("Runner metadata", JSON.stringify(runnerMeta, null, 2), "JSON")
        : `<div class="stream-empty">No runner metadata returned.</div>`;
      const streamsPanel = streamBlocks.length
        ? streamBlocks.join("")
        : `<div class="stream-empty">No stdout, stderr, or raw response stream returned.</div>`;
      const fullPanel = resultPanelBlock("Full runner response", JSON.stringify(result, null, 2), "Runner JSON");
      const varsPanel = renderRuntimeVarsPanel(vars);

      return `
        <div class="response-console ${summaryClass}">
          <div class="response-console-bar">
            ${renderResponseTabs(activeTab)}
            <div class="response-metrics">
              <span class="metric">${escapeHtml(bodyMeta)}</span>
              <span class="metric">${escapeHtml(byteSize(bodyContent))}</span>
            </div>
          </div>
          ${responsePanel("body", activeTab, bodyPanel)}
          ${responsePanel("vars", activeTab, varsPanel)}
          ${responsePanel("runner", activeTab, runnerPanel)}
          ${responsePanel("streams", activeTab, streamsPanel)}
          ${responsePanel("full", activeTab, fullPanel)}
        </div>
      `;
    }

    function normalizedResponseTab() {
      if (!responseTabDefs.some((tab) => tab.id === state.responseTab)) {
        state.responseTab = "body";
      }
      return state.responseTab;
    }

    function renderResponseTabs(activeTab) {
      return `
        <div class="response-tabs" role="tablist" aria-label="Response panels">
          ${responseTabDefs.map((tab) => `
            <button
              type="button"
              class="response-tab ${tab.id === activeTab ? "active" : ""}"
              data-response-tab="${escapeAttr(tab.id)}"
              role="tab"
              aria-selected="${tab.id === activeTab ? "true" : "false"}"
            >${escapeHtml(tab.label)}</button>
          `).join("")}
        </div>
      `;
    }

    function responsePanel(id, activeTab, content) {
      return `
        <div class="response-panel" data-response-panel="${escapeAttr(id)}" role="tabpanel" ${id === activeTab ? "" : "hidden"}>
          ${content}
        </div>
      `;
    }

    function resultPanelBlock(title, content, meta) {
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>${escapeHtml(title)}</span>
            <span class="result-panel-meta">${escapeHtml(meta || "Raw")} · ${escapeHtml(byteSize(content))}</span>
          </div>
          ${resultCodeBlock(content)}
        </div>
      `;
    }

    function resultJsonPanelBlock(title, value, meta, rawContent) {
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>${escapeHtml(title)}</span>
            <span class="result-panel-meta">${escapeHtml(meta || "JSON")} · ${escapeHtml(byteSize(rawContent))}</span>
          </div>
          ${resultJsonTree(value)}
        </div>
      `;
    }

    function resultPlaceholderBlock(title, message, meta) {
      return `
        <div class="response-panel-block">
          <div class="result-panel-head">
            <span>${escapeHtml(title)}</span>
            <span class="result-panel-meta">${escapeHtml(meta || "waiting")}</span>
          </div>
          <div class="stream-empty small">${escapeHtml(message)}</div>
        </div>
      `;
    }

    function resultJsonTree(value) {
      return `<div class="json-tree">${renderJsonValue(value, 0, "", "")}</div>`;
    }

    function renderJsonValue(value, depth, key, suffix) {
      if (Array.isArray(value)) return renderJsonBranch(value, depth, key, suffix, true);
      if (value && typeof value === "object") return renderJsonBranch(value, depth, key, suffix, false);
      return renderJsonPrimitiveLine(value, depth, key, suffix);
    }

    function renderJsonBranch(value, depth, key, suffix, isArray) {
      const entries = isArray ? value.map((item, index) => [String(index), item]) : Object.entries(value);
      const open = isArray ? "[" : "{";
      const close = isArray ? "]" : "}";
      const label = isArray ? `${entries.length} item${entries.length === 1 ? "" : "s"}` : `${entries.length} key${entries.length === 1 ? "" : "s"}`;
      if (!entries.length) {
        return `
          <div class="json-line">
            ${jsonIndent(depth)}
            <span class="json-caret-spacer"></span>
            ${jsonKeyLabel(key)}<span>${open}${close}${escapeHtml(suffix)}</span>
          </div>
        `;
      }

      return `
        <details class="json-toggle" open>
          <summary class="json-line">
            ${jsonIndent(depth)}
            <span class="json-caret">›</span>
            ${jsonKeyLabel(key)}<span>${open}</span><span class="json-summary"> ${escapeHtml(label)}</span><span class="json-collapsed-close">${close}${escapeHtml(suffix)}</span>
          </summary>
          <div class="json-children">
            ${entries.map(([entryKey, entryValue], index) => (
              renderJsonValue(entryValue, depth + 1, isArray ? "" : entryKey, index < entries.length - 1 ? "," : "")
            )).join("")}
          </div>
          <div class="json-line">
            ${jsonIndent(depth)}
            <span class="json-caret-spacer"></span>
            <span>${close}${escapeHtml(suffix)}</span>
          </div>
        </details>
      `;
    }

    function renderJsonPrimitiveLine(value, depth, key, suffix) {
      return `
        <div class="json-line">
          ${jsonIndent(depth)}
          <span class="json-caret-spacer"></span>
          ${jsonKeyLabel(key)}${jsonPrimitive(value)}<span>${escapeHtml(suffix)}</span>
        </div>
      `;
    }

    function jsonIndent(depth) {
      return `<span class="json-indent" style="--depth:${Number(depth) || 0}"></span>`;
    }

    function jsonKeyLabel(key) {
      return key ? `<span class="json-key">${escapeHtml(JSON.stringify(key))}</span><span>: </span>` : "";
    }

    function jsonPrimitive(value) {
      if (typeof value === "string") return `<span class="json-string">${escapeHtml(JSON.stringify(value))}</span>`;
      if (typeof value === "number") return `<span class="json-number">${escapeHtml(String(value))}</span>`;
      if (typeof value === "boolean") return `<span class="json-boolean">${escapeHtml(String(value))}</span>`;
      if (value === null) return `<span class="json-null">null</span>`;
      return `<span>${escapeHtml(JSON.stringify(value))}</span>`;
    }

    function resultCodeBlock(content) {
      return `
        <div class="result-code">
          ${String(content ?? "").split("\n").map((line, index) => `
            <div class="code-line">
              <span class="code-line-number">${index + 1}</span>
              <span class="code-line-text">${escapeHtml(line || " ")}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderRunningResult(step, targetLabel) {
      const notes = Array.isArray(step.runningNotes) && step.runningNotes.length
        ? step.runningNotes
        : defaultRunningNotes(step);
      const activeTab = normalizedResponseTab();
      const runnerInfo = {
        status: "running",
        target: targetLabel,
        runnerUrl: runnerUrl(step),
        stepId: step.id,
        type: step.type,
        expectedWork: notes
      };
      const bodyPanel = `
        <div class="result-summary running">
          <div class="result-heading">
            <div class="result-title with-spinner">
              <span class="spinner" aria-hidden="true"></span>
              <span>Sending request</span>
            </div>
          </div>
          <div class="result-message">${escapeHtml(targetLabel)}</div>
        </div>
        ${resultPlaceholderBlock("Body", "Waiting for the response body. It will appear here in the same format after the runner returns.", "waiting")}
      `;
      return `
        <div class="response-console running">
          <div class="response-console-bar">
            ${renderResponseTabs(activeTab)}
            <div class="response-metrics">
              <span class="spinner" aria-hidden="true"></span>
              <span class="metric warn">Sending</span>
            </div>
          </div>
          ${responsePanel("body", activeTab, bodyPanel)}
          ${responsePanel("vars", activeTab, renderRuntimeVarsPanel())}
          ${responsePanel("runner", activeTab, resultPanelBlock("Runner metadata", JSON.stringify(runnerInfo, null, 2), "JSON"))}
          ${responsePanel("streams", activeTab, resultPlaceholderBlock("Streams", "Waiting for stdout, stderr, or raw text from the runner.", "waiting"))}
          ${responsePanel("full", activeTab, resultPlaceholderBlock("Full runner response", "Full runner response will appear here after completion.", "waiting"))}
        </div>
      `;
    }

    function byteSize(content) {
      const bytes = new TextEncoder().encode(String(content ?? "")).length;
      if (bytes < 1024) return `${bytes} B`;
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    function defaultRunningNotes(step) {
      if (step.type === "near-view") {
        return [
          "Calling a NEAR RPC view method.",
          "No private key, gas, or transaction is used.",
          "Waiting for the RPC response and parsing returned state."
        ];
      }
      if (step.type === "http") {
        return [
          "Sending the HTTP request to the configured backend.",
          "Waiting for the backend response.",
          "Parsing the response and extracting runtime variables."
        ];
      }
      return [
        "Starting the allowlisted local script.",
        "Waiting for the script to call its real backend, RPC, or chain target.",
        "Parsing stdout, stderr, and structured JSON output."
      ];
    }

    function resultMessage(result, parsedJson, ok) {
      const parsed = parsedJson && typeof parsedJson === "object" && !Array.isArray(parsedJson)
        ? parsedJson
        : null;
      if (result.pending && parsed && typeof parsed.publicFacingMessage === "string") {
        return parsed.publicFacingMessage;
      }
      const messages = [
        typeof result.error === "string" ? result.error : "",
        parsed && typeof parsed.error === "string" ? parsed.error : "",
        parsed && typeof parsed.nextStep === "string" ? parsed.nextStep : "",
        result.rpc?.error ? JSON.stringify(result.rpc.error) : ""
      ].filter(Boolean);
      if (messages.length) return messages.join("\n");
      if (ok) return "The runner returned a successful response.";
      return "The runner returned a failed response. The full command, streams, and raw payload are below.";
    }

    function formatCommand(command) {
      return Array.isArray(command) ? command.join(" ") : command || "";
    }

    function parseJsonText(value) {
      if (typeof value !== "string" || !value.trim()) return null;
      try {
        return JSON.parse(value);
      } catch {
        return null;
      }
    }

    async function fireStep() {
      if (state.envOpen && !syncEditors()) return;
      const flow = activeFlow();
      const step = activeStep();
      if (isPendingStep(step)) {
        renderPendingStepResponse(flow, step);
        showToast("This user-story step is marked 未完成.");
        return;
      }
      const target = runnerPath(step);
      const startedAt = new Date().toLocaleTimeString();
      const startedMs = performance.now();
      let targetLabel = `${methodLabel(step)} ${resolvedTarget(step)}`;
      let payload = null;

      $("fireStep").disabled = true;
      state.lastDebugPacket = null;
      $("copyDebugContext").disabled = true;

      try {
        await ensureAutoFillForStep(step);
        ensureTargetValues(step);
        const preview = previewPayload(step);
        targetLabel = `${methodLabel(step)} ${resolvedTarget(step)}`;
        payload = target === "/run/script"
          ? { stepId: step.id, env: state.env, inputs: currentInputs(), vars: state.vars }
          : preview;

        state.responseTab = "body";
        setStepResponse(step, {
          running: true,
          startedAt,
          targetLabel,
          responseTab: state.responseTab,
          vars: snapshotRuntimeVars()
        });
        $("resultMeta").innerHTML = `<span class="pill warn">running</span><span class="pill">started ${startedAt}</span>`;
        $("resultBox").innerHTML = renderRunningResult(step, targetLabel);
        $("responseTarget").textContent = targetLabel;

        const response = await fetch(target, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        const rawResult = await response.json();
        if (rawResult.durationMs === undefined) {
          rawResult.durationMs = Math.round(performance.now() - startedMs);
        }
        applySetEnv(step, rawResult);
        const clearedInputs = rawResult.ok ? applyClears(step) : {};
        applySetVars(step, rawResult);
        seedClearedInputsFromVars(clearedInputs);
        const result = resultForDisplay(rawResult);
        const debugPacket = buildDebugPacket(flow, step, startedAt, targetLabel, payload, result);
        setStepResponse(step, {
          result,
          startedAt,
          targetLabel,
          debugPacket,
          responseTab: "body",
          vars: snapshotRuntimeVars()
        });
        renderTopbar();
        if (isActiveResponseStep(step)) {
          renderActiveStepResponse();
        }
        renderVars();
        renderTabs();
      } catch (error) {
        const result = { ok: false, error: error.message, durationMs: Math.round(performance.now() - startedMs) };
        const debugPacket = buildDebugPacket(
          flow,
          step,
          startedAt,
          targetLabel,
          payload || (target === "/run/script"
            ? { stepId: step.id, env: state.env, inputs: currentInputs(), vars: state.vars }
            : previewPayload(step)),
          result
        );
        setStepResponse(step, {
          result,
          startedAt,
          targetLabel,
          debugPacket,
          responseTab: "body",
          vars: snapshotRuntimeVars()
        });
        if (isActiveResponseStep(step)) {
          renderActiveStepResponse();
        }
      } finally {
        $("fireStep").disabled = isPendingStep(activeStep());
        persist();
      }
    }

    function renderPendingStepResponse(flow, step) {
      const targetLabel = `${methodLabel(step)} ${resolvedTarget(step)}`;
      const result = pendingStepResult(step);
      state.responseTab = "body";
      state.lastResult = result;
      const debugPacket = buildDebugPacket(flow, step, "pending-preview", targetLabel, previewPayload(step), result);
      state.lastDebugPacket = debugPacket;
      const vars = snapshotRuntimeVars();
      setStepResponse(step, {
        result,
        startedAt: "",
        targetLabel,
        debugPacket,
        responseTab: state.responseTab,
        vars
      });
      renderTopbar();
      renderResult(result, "", targetLabel, vars);
      renderVars();
    }

    function handleSendShortcut(event) {
      if (!event.metaKey || event.key !== "Enter" || $("fireStep").disabled) return;
      event.preventDefault();
      fireStep();
    }

    function applyResponseTabState() {
      const activeTab = normalizedResponseTab();
      $("resultBox").querySelectorAll("[data-response-tab]").forEach((button) => {
        const isActive = button.dataset.responseTab === activeTab;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", isActive ? "true" : "false");
      });
      $("resultBox").querySelectorAll("[data-response-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.responsePanel !== activeTab;
      });
    }

    function buildDebugPacket(flow, step, startedAt, targetLabel, payload, result) {
      return {
        project: "ClawHouse",
        worktree: state.env.repoRoot || "",
        flow: flow.name,
        stepId: step.id,
        stepName: step.name,
        type: step.type,
        startedAt,
        runner: {
          method: "POST",
          url: runnerUrl(step)
        },
        target: targetLabel,
        request: {
          method: methodLabel(step),
          template: requestTemplate(step),
          resolvedTarget: resolvedTarget(step),
          inputs: sanitizeSecrets(currentInputs()),
          environment: sanitizeSecrets(state.env)
        },
        requestPayload: sanitizeSecrets(payload),
        response: sanitizeSecrets(result),
        runtimeVars: sanitizeSecrets(state.vars),
        note: "Secrets are redacted. This packet came from the local Acceptance Workbench after manually pressing Send."
      };
    }

    function isSensitiveKey(key) {
      const normalized = String(key).toLowerCase().replace(/[_-]/g, "");
      return normalized.includes("privatekey")
        || normalized.includes("secret")
        || normalized.includes("token")
        || normalized.includes("apikey");
    }

    function sanitizeSecrets(value) {
      if (Array.isArray(value)) return value.map((item) => sanitizeSecrets(item));
      if (value && typeof value === "object") {
        return Object.fromEntries(Object.entries(value).map(([key, item]) => {
          return [key, isSensitiveKey(key) ? "[redacted]" : sanitizeSecrets(item)];
        }));
      }
      return value;
    }

    function buildDebugClipboardText(packet) {
      const safePacket = sanitizeSecrets(packet);
      return [
        "ClawHouse Acceptance Workbench debug context.",
        "",
        "I manually pressed Send in the local Workbench. Debug the concrete failure or unexpected output from this packet. Start with the most likely cause and the next reproducible check. Do not assume the flow works unless it can be reproduced from this context.",
        "",
        "Debug packet:",
        "```json",
        JSON.stringify(safePacket, null, 2),
        "```"
      ].join("\n");
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      if (!copied) throw new Error("Clipboard API unavailable");
    }

    async function copyDebugContext() {
      if (!state.lastDebugPacket) return;
      const button = $("copyDebugContext");
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "Copying...";
      try {
        await copyTextToClipboard(buildDebugClipboardText(state.lastDebugPacket));
        button.textContent = "Copied";
        showToast("Debug context copied");
      } catch (error) {
        button.textContent = original;
        button.disabled = !state.lastDebugPacket;
        const message = error instanceof Error ? error.message : String(error);
        showToast(`Copy failed: ${message}`);
        return;
      }
      setTimeout(() => {
        button.textContent = original;
        button.disabled = !state.lastDebugPacket;
      }, 1200);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    async function boot() {
      const [spec, health] = await Promise.all([
        fetch("/flows.json").then((res) => res.json()),
        fetch("/health").then((res) => res.json())
      ]);
      state.spec = spec;
      normalizeSelection();
      applyRequestSelectionFromUrl();
      normalizeSelection();
      if (!state.env.repoRoot && health.repoRoot) {
        state.env.repoRoot = health.repoRoot;
      }
      if (health.repoRoot) {
        for (const profileId of envProfileIds()) {
          if (!state.envProfiles[profileId].repoRoot) state.envProfiles[profileId].repoRoot = health.repoRoot;
        }
      }
      await restoreEncryptedEnv();
      render();
    }

    $("filter").addEventListener("input", () => {
      state.filter = $("filter").value;
      renderSidebar();
    });

    $("toggleEnv").addEventListener("click", () => {
      state.envOpen = !state.envOpen;
      renderTopbar();
      persist();
    });

    $("envSelect").addEventListener("change", () => {
      switchEnvironmentProfile($("envSelect").value);
    });

    $("saveEnv").addEventListener("click", () => {
      if (syncEditors()) {
        showToast("Environment saved");
      }
    });

    $("clearVars").addEventListener("click", () => {
      state.vars = {};
      $("varsEditor").value = JSON.stringify(state.vars, null, 2);
      renderVars();
      renderRequest();
      if (state.activeTab === "vars") renderVarsTab(activeStep());
      if (state.activeTab === "preview") renderPreview(activeStep());
      persist();
      queueAutoFill();
    });

    $("requestTarget").addEventListener("input", () => {
      const step = activeStep();
      if (step.type !== "http") return;
      state.requestTemplates[step.id] = $("requestTarget").value;
      renderRequest();
      if (state.activeTab === "preview") renderPreview(step);
      persist();
    });
    $("requestTarget").addEventListener("scroll", syncRequestTargetOverlayScroll);
    $("requestTarget").addEventListener("mousemove", handleRequestTargetVariableHover);
    $("requestTarget").addEventListener("mouseleave", hideVariableTooltip);
    $("requestTarget").addEventListener("blur", hideVariableTooltip);

    $("fireStep").addEventListener("click", fireStep);
    $("copyDebugContext").addEventListener("click", copyDebugContext);
    $("resultBox").addEventListener("click", (event) => {
      const button = event.target.closest?.("[data-response-tab]");
      if (!button) return;
      state.responseTab = button.dataset.responseTab || "body";
      const response = activeStepResponse();
      if (response) response.responseTab = state.responseTab;
      applyResponseTabState();
      persist();
    });
    document.addEventListener("keydown", handleSendShortcut);
    $("sidebar").addEventListener("keydown", handleSidebarStepKeydown);
    window.addEventListener("popstate", handleRequestPopState);

    boot().catch((error) => {
      $("resultBox").textContent = error.message;
    });
  </script>
</body>
</html>
