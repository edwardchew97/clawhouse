<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawHouse Acceptance Workbench</title>
  <style>
    :root {
      --bg: #fbfbfa;
      --surface: #ffffff;
      --selected: #f5f5f5;
      --border: #f2f2f2;
      --border-strong: #e5e5e2;
      --strong: #292929;
      --default: #5d5d5d;
      --subtle: #7f7f7f;
      --green: #2f6f4e;
      --red: #a23a35;
      --amber: #8b6424;
      --blue: #2f5f8f;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--strong);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: auto;
    }

    .sidebar-top {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand strong {
      font-size: 16px;
      font-weight: 650;
    }

    .workspace-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: #ffffff;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--default);
    }

    .search {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--selected);
      padding: 7px 9px;
      outline: none;
    }

    .sidebar-section {
      padding: 12px 10px 18px;
      display: grid;
      gap: 10px;
    }

    .sidebar-label,
    .field label,
    .tab-meta {
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.35;
    }

    .flow-block {
      display: grid;
      gap: 4px;
    }

    .access-filter-row {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .access-filter-button {
      min-height: 24px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--subtle);
      padding: 3px 7px;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
    }

    .access-filter-button.active,
    .access-filter-button:hover {
      border-color: var(--border-strong);
      background: var(--selected);
      color: var(--strong);
    }

    #flowList {
      display: grid;
      gap: 6px;
    }

    .flow-button,
    .step-button,
    .tab,
    .button,
    .mini-button {
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .flow-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 32px;
      border-radius: 7px;
      padding: 7px 8px;
      text-align: left;
      color: var(--strong);
      font-weight: 560;
      line-height: 1.25;
    }

    .flow-button.active,
    .flow-button:hover,
    .step-button.active,
    .step-button:hover {
      background: var(--selected);
    }

    .flow-title {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .flow-sequence {
      flex: 0 0 auto;
      min-width: 42px;
      border-radius: 5px;
      background: var(--selected);
      color: var(--subtle);
      padding: 2px 5px;
      font-size: 11px;
      line-height: 1.2;
      text-align: center;
    }

    .flow-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flow-chevron {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid var(--subtle);
      border-bottom: 1.5px solid var(--subtle);
      transform: rotate(-45deg);
      transition: transform 120ms ease-out, border-color 120ms ease-out;
    }

    .flow-button[aria-expanded="true"] .flow-chevron {
      transform: rotate(45deg);
    }

    .flow-button.active .flow-chevron,
    .flow-button:hover .flow-chevron {
      border-color: var(--default);
    }

    .step-list {
      display: grid;
      gap: 2px;
      margin-left: 12px;
      padding-left: 9px;
      border-left: 1px solid var(--border);
    }

    .step-list[hidden] {
      display: none;
    }

    .step-button {
      display: grid;
      grid-template-columns: 34px 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 30px;
      border-radius: 7px;
      padding: 5px 7px;
      text-align: left;
      color: var(--default);
      font-size: 12px;
      line-height: 1.25;
    }

    .step-index {
      justify-self: start;
      min-width: 30px;
      border-radius: 5px;
      background: var(--selected);
      color: var(--subtle);
      padding: 3px 5px;
      font-family: var(--mono);
      font-size: 11px;
      text-align: center;
    }

    .step-button.active .step-index {
      color: var(--strong);
    }

    .step-button strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 520;
    }

    .step-button.active strong {
      color: var(--strong);
      font-weight: 600;
    }

    .access-tag {
      justify-self: end;
      border-radius: 5px;
      background: var(--selected);
      color: var(--subtle);
      padding: 2px 5px;
      font-size: 11px;
      line-height: 1.2;
    }

    .access-tag.protected {
      color: var(--red);
    }

    .access-tag.public {
      color: var(--green);
    }

    .verb {
      justify-self: start;
      width: 50px;
      border-radius: 5px;
      background: var(--selected);
      color: var(--default);
      padding: 3px 5px;
      font-family: var(--mono);
      font-size: 11px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-chevron {
        transition: none;
      }
    }

    .verb.post,
    .verb.script {
      color: var(--blue);
    }

    .verb.view {
      color: var(--amber);
    }

    .verb.todo {
      color: var(--red);
    }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 10px 14px;
      background: rgba(251, 251, 250, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--default);
      font-size: 12px;
    }

    .crumb-current {
      color: var(--strong);
      font-weight: 560;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .env-control {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .env-select,
    .select,
    .input,
    .textarea {
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #ffffff;
      outline: none;
    }

    .env-select {
      height: 32px;
      min-width: 172px;
      padding: 6px 9px;
    }

    .env-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(47, 111, 78, 0.08);
    }

    .env-dot.dev {
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 95, 143, 0.08);
    }

    .env-dot.staging {
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(139, 100, 36, 0.1);
    }

    .env-dot.production {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(162, 58, 53, 0.08);
    }

    .button,
    .mini-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #ffffff;
      padding: 7px 10px;
      font-weight: 560;
      white-space: nowrap;
    }

    .button:hover,
    .mini-button:hover {
      background: var(--selected);
    }

    .button.primary {
      border-color: var(--strong);
      background: var(--strong);
      color: #ffffff;
    }

    .button.primary:hover {
      background: #111111;
    }

    .button.primary:disabled {
      border-color: var(--border-strong);
      background: #eeeeee;
      color: var(--default);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .mini-button {
      min-height: 28px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .env-drawer {
      display: none;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 12px;
      padding: 12px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    .env-drawer.open {
      display: grid;
    }

    .env-summary {
      display: grid;
      gap: 6px;
      align-content: start;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fbfbfa;
    }

    .env-summary-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .env-summary-title strong {
      font-size: 13px;
      font-weight: 650;
    }

    .env-summary p {
      margin: 0;
      color: var(--default);
      font-size: 12px;
      line-height: 1.45;
    }

    .workbench {
      min-width: 0;
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .request-shell,
    .response-shell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .request-head,
    .response-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .title-block {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .request-description {
      max-width: 860px;
      margin: 2px 0 0;
      color: var(--default);
      font-size: 13px;
      line-height: 1.42;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 650;
      line-height: 1.2;
    }

    h1 {
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    h2 {
      font-size: 16px;
    }

    .request-line {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr) auto;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .select,
    .input {
      width: 100%;
      height: 36px;
      padding: 8px 10px;
    }

    .request-target {
      font-family: var(--mono);
      font-size: 12px;
      position: relative;
      z-index: 2;
      background: transparent;
    }

    .request-target.pending {
      color: var(--subtle);
      background: #fbfbfb;
    }

    .input[readonly] {
      color: var(--default);
      background: #fafafa;
    }

    .input:focus,
    .textarea:focus,
    .select:focus,
    .env-select:focus {
      border-color: var(--strong);
      box-shadow: 0 0 0 2px rgba(41, 41, 41, 0.08);
    }

    .template-input {
      position: relative;
      min-width: 0;
      height: 36px;
    }

    .template-overlay {
      position: absolute;
      inset: 1px;
      z-index: 1;
      overflow: hidden;
      padding: 8px 10px;
      color: transparent;
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre;
      pointer-events: none;
    }

    .template-overlay-content {
      display: inline-block;
      transform: translateX(calc(var(--template-scroll-left, 0px) * -1));
    }

    .template-var {
      border: 1px solid rgba(47, 95, 143, 0.24);
      border-radius: 5px;
      background: rgba(47, 95, 143, 0.12);
      color: transparent;
    }

    .template-var.missing {
      border-color: rgba(162, 58, 53, 0.28);
      background: rgba(162, 58, 53, 0.1);
    }

    .variable-tooltip {
      position: fixed;
      z-index: 30;
      max-width: min(420px, calc(100vw - 16px));
      padding: 8px 9px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(41, 41, 41, 0.14);
      pointer-events: none;
    }

    .variable-tooltip[hidden] {
      display: none;
    }

    .variable-tooltip-key {
      color: var(--subtle);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.35;
    }

    .variable-tooltip-value {
      margin-top: 3px;
      color: var(--strong);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .variable-tooltip.missing .variable-tooltip-value {
      color: var(--red);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab {
      min-height: 38px;
      border-radius: 0;
      padding: 10px 10px;
      color: var(--default);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--strong);
      border-bottom-color: var(--strong);
      font-weight: 560;
    }

    .tab-body {
      padding: 14px;
    }

    .fields {
      display: grid;
      gap: 9px;
    }

    .params-fields {
      grid-template-columns: 1fr;
    }

    .params-fields .kv-row {
      grid-template-columns: minmax(120px, 170px) minmax(0, 1fr);
    }

    .kv-row {
      display: grid;
      grid-template-columns: minmax(120px, 210px) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .textarea {
      width: 100%;
      min-height: 168px;
      resize: vertical;
      padding: 10px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }

    .code {
      margin: 0;
      padding: 12px;
      background: #191919;
      color: #eeeeee;
      border-radius: 7px;
      overflow: auto;
      min-height: 180px;
      max-height: 520px;
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }

    .light-code {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fafafa;
      color: var(--strong);
      overflow: auto;
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }

    .result-view {
      display: grid;
      gap: 10px;
      min-height: 180px;
    }

    .result-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fafafa;
      color: var(--default);
      font-size: 13px;
    }

    .response-console {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #ffffff;
      overflow: hidden;
    }

    .response-console-bar,
    .result-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: #fcfcfb;
    }

    .response-tabs,
    .response-metrics {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .response-tab {
      appearance: none;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--default);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 560;
      padding: 0 0 7px;
      white-space: nowrap;
    }

    .response-tab.active {
      border-bottom-color: var(--strong);
      color: var(--strong);
      font-weight: 650;
    }

    .response-tab:hover {
      color: var(--strong);
    }

    .metric {
      color: var(--default);
      font-family: var(--mono);
      font-size: 12px;
      white-space: nowrap;
    }

    .metric.ok {
      color: var(--green);
      font-weight: 650;
    }

    .metric.fail {
      color: var(--red);
      font-weight: 650;
    }

    .metric.warn {
      color: var(--amber);
      font-weight: 650;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #eadfc8;
      border-top-color: var(--amber);
      border-radius: 999px;
      animation: spin 780ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-summary {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .result-summary.ok {
      box-shadow: inset 3px 0 0 var(--green);
    }

    .result-summary.fail {
      box-shadow: inset 3px 0 0 var(--red);
    }

    .result-summary.pending {
      background: #fffdf8;
      box-shadow: inset 3px 0 0 var(--amber);
    }

    .result-summary.running {
      background: #fffdf8;
      box-shadow: inset 3px 0 0 var(--amber);
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .result-title {
      color: var(--strong);
      font-size: 14px;
      font-weight: 650;
    }

    .result-title.with-spinner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .result-message {
      color: var(--default);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .response-panel {
      background: #ffffff;
    }

    .response-panel[hidden] {
      display: none;
    }

    .response-panel-block {
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .response-panel-block:last-child {
      border-bottom: 0;
    }

    .result-panel-head {
      color: var(--strong);
      font-size: 13px;
      font-weight: 620;
    }

    .result-panel-meta {
      color: var(--subtle);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 520;
      white-space: nowrap;
    }

    .stream-empty {
      display: grid;
      min-height: 128px;
      place-items: center;
      color: var(--default);
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }

    .stream-empty.small {
      min-height: 96px;
    }

    .result-code {
      max-height: 460px;
      overflow: auto;
      background: #ffffff;
      color: var(--strong);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }

    .code-line {
      display: grid;
      grid-template-columns: 44px minmax(max-content, 1fr);
      min-width: max-content;
    }

    .code-line-number {
      position: sticky;
      left: 0;
      z-index: 1;
      padding: 0 10px 0 6px;
      border-right: 1px solid var(--border);
      background: #fbfbfa;
      color: #a0a09b;
      text-align: right;
      user-select: none;
    }

    .code-line-text {
      padding: 0 12px;
      white-space: pre;
    }

    .json-tree {
      max-height: 460px;
      overflow: auto;
      background: #ffffff;
      color: var(--strong);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      padding: 6px 0;
    }

    .json-toggle {
      min-width: max-content;
    }

    .json-toggle > summary {
      list-style: none;
      cursor: pointer;
    }

    .json-toggle > summary::-webkit-details-marker {
      display: none;
    }

    .json-line {
      display: flex;
      align-items: baseline;
      min-width: max-content;
      min-height: 20px;
      padding: 0 12px;
      white-space: pre;
    }

    .json-line:hover {
      background: #fafafa;
    }

    .json-indent {
      flex: 0 0 calc(var(--depth) * 16px);
    }

    .json-caret,
    .json-caret-spacer {
      flex: 0 0 14px;
      color: var(--subtle);
      user-select: none;
    }

    .json-caret {
      transition: transform 120ms ease-out;
    }

    .json-toggle[open] > summary .json-caret {
      transform: rotate(90deg);
    }

    .json-key {
      color: var(--blue);
    }

    .json-string {
      color: var(--green);
    }

    .json-number {
      color: var(--amber);
    }

    .json-boolean {
      color: var(--red);
    }

    .json-null,
    .json-summary {
      color: var(--subtle);
    }

    .json-toggle[open] > summary .json-collapsed-close {
      display: none;
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--selected);
      color: var(--default);
      font-size: 12px;
      font-weight: 560;
    }

    .pill.ok {
      color: var(--green);
      background: #edf6f1;
    }

    .pill.fail {
      color: var(--red);
      background: #fbefed;
    }

    .toast {
      position: fixed;
      top: 66px;
      right: 18px;
      z-index: 20;
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #ffffff;
      color: var(--strong);
      box-shadow: 0 10px 30px rgba(41, 41, 41, 0.12);
      font-size: 12px;
      font-weight: 560;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .pill.warn {
      color: var(--amber);
      background: #faf3e5;
    }

    .pill.pending {
      color: var(--red);
      background: #fbefed;
    }

    .response-shell {
      display: grid;
    }

    .response-body {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .vars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }

    .response-vars-grid {
      padding: 10px;
    }

    .var-card {
      display: grid;
      gap: 4px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #ffffff;
      min-width: 0;
    }

    .var-key {
      color: var(--subtle);
      font-family: var(--mono);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .var-value {
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--subtle);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
      }

      .env-drawer {
        grid-template-columns: 1fr;
      }

      .request-line {
        grid-template-columns: 96px minmax(0, 1fr);
      }

      .request-line .button {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 680px) {
      .topbar,
      .request-head,
      .response-head {
        align-items: stretch;
        flex-direction: column;
      }

      .env-control {
        justify-content: flex-start;
        width: 100%;
      }

      .env-select {
        min-width: 0;
        flex: 1;
      }

      .kv-row {
        grid-template-columns: 1fr;
      }

      .params-fields {
        grid-template-columns: 1fr;
      }

      .params-fields .kv-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand">
            <strong>ClawHouse</strong>
            <span class="sidebar-label">Acceptance</span>
          </div>
          <span id="workspacePill" class="workspace-pill">Local</span>
        </div>
        <input id="filter" class="search" placeholder="Filter requests" />
        <div id="accessFilter" class="access-filter-row" role="group" aria-label="Request access filter"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Acceptance steps</div>
        <div id="flowList"></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="crumbs">
          <span>Acceptance steps</span>
          <span>/</span>
          <span id="crumbFlow"></span>
          <span>/</span>
          <span id="crumbStep" class="crumb-current"></span>
        </div>
        <div class="env-control">
          <span id="envDot" class="env-dot"></span>
          <select id="envSelect" class="env-select">
            <option value="local">Local</option>
            <option value="dev">Dev</option>
            <option value="staging">Staging</option>
            <option value="production">Production</option>
          </select>
          <button id="toggleEnv" class="mini-button">Environment</button>
        </div>
      </header>

      <section id="envDrawer" class="env-drawer">
        <div class="field">
          <div class="env-summary">
            <div class="env-summary-title">
              <strong id="envProfileName">Local</strong>
              <span id="envProfileBranch" class="pill">local</span>
            </div>
            <p id="envProfileDescription"></p>
            <p>Secrets stay out of git. Fill tokens, database URLs, and private keys only in this local browser editor.</p>
          </div>
          <label>Environment JSON</label>
          <textarea id="envEditor" class="textarea"></textarea>
        </div>
        <div class="field">
          <label>Runtime Variables JSON</label>
          <textarea id="varsEditor" class="textarea"></textarea>
          <div class="pill-row">
            <button id="saveEnv" class="mini-button">Save</button>
            <button id="clearVars" class="mini-button">Clear Runtime Vars</button>
          </div>
        </div>
      </section>

      <section class="workbench">
        <div class="request-shell">
          <div class="request-head">
            <div class="title-block">
              <h1 id="stepName">Request</h1>
              <p id="stepDescription" class="request-description"></p>
              <span id="stepType" class="tab-meta"></span>
            </div>
            <div id="requestPills" class="pill-row"></div>
          </div>

          <div class="request-line">
            <select id="methodSelect" class="select"></select>
            <div class="template-input">
              <div id="requestTargetOverlay" class="template-overlay" aria-hidden="true"></div>
              <input id="requestTarget" class="input request-target" />
            </div>
            <button id="fireStep" class="button primary">Send</button>
          </div>

          <nav id="tabs" class="tabs"></nav>
          <div id="tabBody" class="tab-body"></div>
        </div>

        <div class="response-shell">
          <div class="response-head">
            <div class="title-block">
              <h2>Response</h2>
              <span id="responseTarget" class="tab-meta">No request sent.</span>
            </div>
            <div class="pill-row">
              <button id="copyDebugContext" class="mini-button" disabled>Copy Debug Context</button>
              <div id="resultMeta" class="pill-row"></div>
            </div>
          </div>
          <div class="response-body">
            <div id="resultBox" class="result-view">
              <div class="result-empty">No response yet.</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="variableTooltip" class="variable-tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "clawhouse.acceptance.workbench.v2";
    const sidebarSequenceVersion = 1;
    const defaultEnv = {
      repoRoot: "",
      ledgerBaseUrl: "http://127.0.0.1:4321",
      nearRpcUrl: "https://rpc.testnet.fastnear.com",
      contractId: "clawhouse-key-20260619125948.testnet",
      nearNetworkId: "testnet",
      testUserAccountId: "",
      testUserPrivateKey: "",
      ledgerWalletFile: "work/acceptance-workbench/agent-board-ledger/workbench-wallet.json",
      ledgerWalletPrivateKey: "",
      accountId: ""
    };

    const obsoleteEnvKeys = [
      "baseUrl",
      "apiToken",
      "reviewer",
      "ironclawBaseUrl",
      "ironclawWebhookUrl",
      "ironclawWebhookSecret"
    ];

    const environmentProfiles = {
      local: {
        label: "Local",
        branch: "local",
        description: "Runs against the local Workbench runner and local ClawHouse backend on your machine.",
        env: {
          ledgerBaseUrl: "http://127.0.0.1:4321"
        }
      },
      dev: {
        label: "Dev",
        branch: "dev",
        description: "Integration target for the dev branch. Paste a current dev or preview backend URL before sending backend requests.",
        env: {
          ledgerBaseUrl: ""
        }
      },
      staging: {
        label: "Staging",
        branch: "staging",
        description: "Pre-production backend project with its own Vercel environment and database.",
        env: {
          ledgerBaseUrl: "https://clawhouse-backend-staging.vercel.app"
        }
      },
      production: {
        label: "Production",
        branch: "main",
        description: "Production backend project. Use with production credentials only when you intend to touch live data.",
        env: {
          ledgerBaseUrl: "https://clawhouse-backend-prod.vercel.app"
        }
      }
    };

    const environmentOwnedKeys = new Set([
      "ledgerBaseUrl",
      "ledgerWalletFile",
      "ledgerWalletPrivateKey",
      "nearRpcUrl",
      "contractId",
      "nearNetworkId"
    ]);

    const encryptedEnvKeys = new Set([
      "testUserPrivateKey",
      "ledgerWalletPrivateKey"
    ]);

    function pruneObsoleteEnv(env) {
      const next = { ...env };
      for (const key of obsoleteEnvKeys) delete next[key];
      return next;
    }

    function envProfileIds() {
      return Object.keys(environmentProfiles);
    }

    function normalizeEnvProfileId(profileId) {
      return envProfileIds().includes(profileId) ? profileId : "local";
    }

    function defaultEnvForProfile(profileId) {
      const profile = environmentProfiles[normalizeEnvProfileId(profileId)];
      return { ...defaultEnv, ...profile.env };
    }

    function emptyEncryptedEnvValues() {
      return Object.fromEntries([...encryptedEnvKeys].map((key) => [key, ""]));
    }

    function migrateEnvProfiles(persistedState) {
      const savedProfiles = persistedState.envProfiles && typeof persistedState.envProfiles === "object"
        ? persistedState.envProfiles
        : {};
      const profiles = {};
      for (const profileId of envProfileIds()) {
        profiles[profileId] = {
          ...defaultEnvForProfile(profileId),
          ...pruneObsoleteEnv(savedProfiles[profileId] || {}),
          ...emptyEncryptedEnvValues()
        };
      }
      if (!Object.keys(savedProfiles).length && persistedState.env) {
        profiles.local = {
          ...defaultEnvForProfile("local"),
          ...pruneObsoleteEnv(persistedState.env),
          ...emptyEncryptedEnvValues()
        };
      }
      return profiles;
    }

    function migrateEncryptedEnvProfiles(persistedState) {
      const savedProfiles = persistedState.encryptedEnvProfiles && typeof persistedState.encryptedEnvProfiles === "object"
        ? persistedState.encryptedEnvProfiles
        : {};
      const profiles = {};
      for (const profileId of envProfileIds()) {
        profiles[profileId] = { ...(savedProfiles[profileId] || {}) };
      }
      if (!Object.keys(savedProfiles).length && persistedState.encryptedEnv) {
        profiles.local = { ...persistedState.encryptedEnv };
      }
      return profiles;
    }

    const persisted = loadState();
    const activeEnvProfile = normalizeEnvProfileId(persisted.activeEnvProfile);
    const envProfiles = migrateEnvProfiles(persisted);
    const requestQueryParam = "request";
    const state = {
      spec: null,
      activeFlow: 0,
      activeStep: 0,
      activeTab: persisted.activeTab || "params",
      responseTab: persisted.responseTab || "body",
      envOpen: persisted.envOpen || false,
      filter: "",
      activeEnvProfile,
      envProfiles,
      env: { ...envProfiles[activeEnvProfile], ...emptyEncryptedEnvValues() },
      encryptedEnvProfiles: migrateEncryptedEnvProfiles(persisted),
      collapsedFlows: persisted.sidebarSequenceVersion === sidebarSequenceVersion ? persisted.collapsedFlows || {} : {},
      accessFilter: persisted.accessFilter || "all",
      vars: persisted.vars || {},
      inputs: persisted.inputs || {},
      requestTemplates: persisted.requestTemplates || {},
      lastResult: null,
      lastDebugPacket: null,
      stepResponses: {}
    };

    const tabs = [
      { id: "params", label: "Params" },
      { id: "headers", label: "Headers" },
      { id: "body", label: "Body / Args" },
      { id: "vars", label: "Vars" },
      { id: "preview", label: "Preview" }
    ];

    const responseTabDefs = [
      { id: "body", label: "Body" },
      { id: "vars", label: "Vars" },
      { id: "runner", label: "Runner" },
      { id: "streams", label: "Streams" },
      { id: "full", label: "Full" }
    ];

    const accessFilterDefs = [
      { id: "all", label: "All" },
      { id: "public", label: "Public" },
      { id: "protected", label: "Protected" }
    ];

    const $ = (id) => document.getElementById(id);
    const autoFillInFlight = new Map();
    let autoFillTimer = null;
    let textMeasureCanvas = null;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        return {};
      }
    }

    function persist() {
      writePersistedState();
      queueEncryptedEnvSync();
    }

    function writePersistedState() {
      updateActiveEnvProfile();
      localStorage.setItem(storageKey, JSON.stringify({
        activeTab: state.activeTab,
        responseTab: state.responseTab,
        envOpen: state.envOpen,
        activeEnvProfile: state.activeEnvProfile,
        envProfiles: state.envProfiles,
        encryptedEnvProfiles: state.encryptedEnvProfiles,
        sidebarSequenceVersion,
        collapsedFlows: state.collapsedFlows,
        accessFilter: currentAccessFilter(),
        vars: state.vars,
        inputs: state.inputs,
        requestTemplates: state.requestTemplates
      }));
    }

    function persistableEnv(env = state.env) {
      const next = { ...env };
      for (const key of encryptedEnvKeys) {
        next[key] = "";
      }
      return next;
    }

    function updateActiveEnvProfile() {
      state.envProfiles[state.activeEnvProfile] = persistableEnv();
    }

    function activeEnvironmentProfile() {
      return environmentProfiles[state.activeEnvProfile] || environmentProfiles.local;
    }

    function activeEncryptedEnv() {
      state.encryptedEnvProfiles[state.activeEnvProfile] ||= {};
      return state.encryptedEnvProfiles[state.activeEnvProfile];
    }

    function displayEnv() {
      const next = { ...state.env };
      for (const key of encryptedEnvKeys) {
        if (next[key]) next[key] = "[not shown]";
      }
      return next;
    }

    let encryptedEnvSyncTimer = null;
    const lastEncryptedEnvValues = {};

    function encryptedEnvCache(profileId) {
      lastEncryptedEnvValues[profileId] ||= {};
      return lastEncryptedEnvValues[profileId];
    }

    function queueEncryptedEnvSync() {
      const profileId = state.activeEnvProfile;
      const cache = encryptedEnvCache(profileId);
      const hasPendingValue = [...encryptedEnvKeys].some((key) => {
        const value = state.env[key] || "";
        return value && value !== cache[key];
      });
      if (!hasPendingValue) return;
      if (encryptedEnvSyncTimer) clearTimeout(encryptedEnvSyncTimer);
      encryptedEnvSyncTimer = setTimeout(() => {
        encryptEnvValues(profileId);
      }, 200);
    }

    async function encryptEnvValues(profileId) {
      const cache = encryptedEnvCache(profileId);
      for (const key of encryptedEnvKeys) {
        const value = state.env[key] || "";
        if (!value || value === cache[key]) continue;
        try {
          const response = await fetch("/crypto/encrypt", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ value })
          });
          const result = await response.json();
          if (!result.ok) throw new Error(result.error || "Private env encryption failed");
          if (state.activeEnvProfile === profileId && state.env[key] !== value) continue;
          state.encryptedEnvProfiles[profileId] ||= {};
          state.encryptedEnvProfiles[profileId][key] = result.ciphertext;
          cache[key] = value;
          writePersistedState();
        } catch (error) {
          console.warn(error);
        }
      }
    }

    async function restoreEncryptedEnv() {
      const profileId = state.activeEnvProfile;
      const encryptedEnv = activeEncryptedEnv();
      const cache = encryptedEnvCache(profileId);
      for (const key of encryptedEnvKeys) {
        const ciphertext = encryptedEnv[key];
        if (!ciphertext) continue;
        try {
          const response = await fetch("/crypto/decrypt", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ciphertext })
          });
          const result = await response.json();
          if (!result.ok) throw new Error(result.error || "Private env decrypt failed");
          state.env[key] = result.value || "";
          cache[key] = state.env[key];
        } catch (error) {
          console.warn(error);
        }
      }
    }

    async function switchEnvironmentProfile(profileId) {
      const nextProfileId = normalizeEnvProfileId(profileId);
      if (nextProfileId === state.activeEnvProfile) return;
      updateActiveEnvProfile();
      state.activeEnvProfile = nextProfileId;
      state.env = { ...state.envProfiles[nextProfileId], ...emptyEncryptedEnvValues() };
      await restoreEncryptedEnv();
      render();
      showToast(`${activeEnvironmentProfile().label} environment selected`);
    }

    function activeFlow() {
      return state.spec.flows[state.activeFlow];
    }

    function activeStep() {
      return activeFlow().steps[state.activeStep];
    }

    function normalizeSelection() {
      const flows = Array.isArray(state.spec?.flows) ? state.spec.flows : [];
      if (!flows.length) {
        state.activeFlow = 0;
        state.activeStep = 0;
        return;
      }
      if (state.activeFlow < 0 || state.activeFlow >= flows.length) {
        state.activeFlow = 0;
      }
      const steps = Array.isArray(flows[state.activeFlow]?.steps) ? flows[state.activeFlow].steps : [];
      if (state.activeStep < 0 || state.activeStep >= steps.length) {
        state.activeStep = 0;
      }
      if (!tabs.some((tab) => tab.id === state.activeTab)) {
        state.activeTab = "params";
      }
    }

    function currentInputs(step = activeStep()) {
      const defaults = step.inputs || {};
      const fillDefaultsWhenEmpty = new Set(step.fillDefaultsWhenEmpty || []);
      state.inputs[step.id] ||= {};
      for (const [key, value] of Object.entries(defaults)) {
        if (
          !(key in state.inputs[step.id])
          || (fillDefaultsWhenEmpty.has(key) && state.inputs[step.id][key] === "" && value !== "")
        ) {
          state.inputs[step.id][key] = value;
        }
      }
      return state.inputs[step.id];
    }

    function findStepById(stepId) {
      for (const flow of state.spec.flows) {
        for (const step of flow.steps) {
          if (step.id === stepId) return step;
        }
      }
      return null;
    }

    function findStepRefById(stepId) {
      if (!stepId) return null;
      const flows = Array.isArray(state.spec?.flows) ? state.spec.flows : [];
      for (let flowIndex = 0; flowIndex < flows.length; flowIndex += 1) {
        const steps = Array.isArray(flows[flowIndex].steps) ? flows[flowIndex].steps : [];
        for (let stepIndex = 0; stepIndex < steps.length; stepIndex += 1) {
          if (steps[stepIndex].id === stepId) return { flowIndex, stepIndex };
        }
      }
      return null;
    }

    function activeStepId() {
      const step = state.spec?.flows?.[state.activeFlow]?.steps?.[state.activeStep];
      return step?.id || "";
    }

    function stepResponseKey(step = activeStep()) {
      return step?.id || "";
    }

    function activeStepResponse() {
      return state.stepResponses[stepResponseKey(activeStep())] || null;
    }

    function setStepResponse(step, response) {
      const key = stepResponseKey(step);
      if (!key) return null;
      state.stepResponses[key] = response;
      return response;
    }

    function isActiveResponseStep(step) {
      return stepResponseKey(step) === stepResponseKey(activeStep());
    }

    function snapshotRuntimeVars() {
      return JSON.parse(JSON.stringify(state.vars || {}));
    }

    function requestStepIdFromUrl() {
      return new URLSearchParams(window.location.search).get(requestQueryParam) || "";
    }

    function updateRequestUrl(historyMode = "replace") {
      const stepId = activeStepId();
      if (!stepId) return;
      const url = new URL(window.location.href);
      url.searchParams.set(requestQueryParam, stepId);
      const nextUrl = `${url.pathname}${url.search}${url.hash}`;
      const currentUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      if (nextUrl === currentUrl) return;
      if (historyMode === "push") {
        window.history.pushState({ [requestQueryParam]: stepId }, "", nextUrl);
      } else {
        window.history.replaceState({ [requestQueryParam]: stepId }, "", nextUrl);
      }
    }

    function expandFlow(flowIndex) {
      const flow = state.spec?.flows?.[flowIndex];
      if (!flow) return;
      state.collapsedFlows[flowCollapseKey(flow, flowIndex)] = false;
    }

    function applyRequestSelectionFromUrl() {
      const ref = findStepRefById(requestStepIdFromUrl());
      if (!ref) return false;
      state.activeFlow = ref.flowIndex;
      state.activeStep = ref.stepIndex;
      expandFlow(ref.flowIndex);
      return true;
    }

    function visibleStepRefs() {
      const needle = state.filter.trim().toLowerCase();
      const refs = [];
      for (let flowIndex = 0; flowIndex < state.spec.flows.length; flowIndex += 1) {
        for (const { stepIndex } of sidebarSteps(state.spec.flows[flowIndex], flowIndex, needle)) {
          refs.push({ flowIndex, stepIndex });
        }
      }
      return refs;
    }

    function visibleStepRefIndex(refs, flowIndex, stepIndex) {
      return refs.findIndex((ref) => ref.flowIndex === flowIndex && ref.stepIndex === stepIndex);
    }

    function focusActiveSidebarStep() {
      requestAnimationFrame(() => {
        document.querySelector(`[data-flow="${state.activeFlow}"][data-step="${state.activeStep}"]`)?.focus();
      });
    }

    function selectStep(flowIndex, stepIndex, options = {}) {
      state.activeFlow = flowIndex;
      state.activeStep = stepIndex;
      expandFlow(flowIndex);
      normalizeSelection();
      updateRequestUrl(options.historyMode || "push");
      render();
      if (options.focusSidebar) focusActiveSidebarStep();
    }

    function handleRequestPopState() {
      if (!state.spec || !applyRequestSelectionFromUrl()) return;
      normalizeSelection();
      render();
    }

    function sidebarStepRefFromEvent(event) {
      const button = event.target.closest?.("[data-step]");
      if (button && $("sidebar")?.contains(button)) {
        return {
          flowIndex: Number(button.dataset.flow),
          stepIndex: Number(button.dataset.step)
        };
      }
      return { flowIndex: state.activeFlow, stepIndex: state.activeStep };
    }

    function moveSidebarStep(ref, delta) {
      const refs = visibleStepRefs();
      if (!refs.length) return false;
      const currentIndex = visibleStepRefIndex(refs, ref.flowIndex, ref.stepIndex);
      const activeIndex = visibleStepRefIndex(refs, state.activeFlow, state.activeStep);
      const baseIndex = currentIndex >= 0
        ? currentIndex
        : activeIndex >= 0
          ? activeIndex
          : delta > 0
            ? -1
            : refs.length;
      const next = refs[baseIndex + delta];
      if (!next) return false;
      selectStep(next.flowIndex, next.stepIndex, { historyMode: "push", focusSidebar: true });
      return true;
    }

    function handleSidebarStepKeydown(event) {
      if (event.defaultPrevented) return;
      if (event.key !== "Tab") return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (!$("sidebar")?.contains(event.target)) return;
      event.preventDefault();
      if (!moveSidebarStep(sidebarStepRefFromEvent(event), event.shiftKey ? -1 : 1)) {
        focusActiveSidebarStep();
      }
    }

    function isPendingStep(step = activeStep()) {
      return step.type === "pending" || step.status === "未完成" || step.implemented === false;
    }

    function pendingReason(step = activeStep()) {
      return step.pendingReason || step.description || "This acceptance step is not implemented yet.";
    }

    function pendingStepPrompt(step = activeStep()) {
      if (Array.isArray(step.responseLines) && step.responseLines.length) return step.responseLines;
      if (Array.isArray(step.runningNotes) && step.runningNotes.length) return step.runningNotes;
      return [`未完成: ${pendingReason(step)}`];
    }

    function pendingStepResult(step = activeStep()) {
      const reason = pendingReason(step);
      const publicFacingMessage = step.publicFacingMessage || step.description || reason;
      return {
        ok: false,
        pending: true,
        status: step.status || "未完成",
        runnable: false,
        stepId: step.id,
        stepName: step.name,
        error: `未完成: ${reason}`,
        json: {
          ok: false,
          status: step.status || "未完成",
          runnable: false,
          stepId: step.id,
          stepName: step.name,
          publicFacingMessage,
          pendingReason: reason,
          prompt: pendingStepPrompt(step)
        }
      };
    }

    function methodLabel(step = activeStep()) {
      if (isPendingStep(step)) return "未完成";
      if (step.type === "http") return step.method || "GET";
      if (step.type === "near-view") return "VIEW";
      return "SCRIPT";
    }

    function methodClass(step = activeStep()) {
      if (isPendingStep(step)) return "todo";
      return methodLabel(step).toLowerCase();
    }

    function stepAccess(step) {
      if (step.access === "public" || step.access === "protected") return step.access;
      return "";
    }

    function accessLabel(step) {
      const access = stepAccess(step);
      if (access === "public") return "Public";
      if (access === "protected") return "Protected";
      return "";
    }

    function currentAccessFilter() {
      const selected = state.accessFilter;
      if (selected === "public" || selected === "protected") return selected;
      return "all";
    }

    function matchesSidebarFilters(flow, step, needle) {
      const accessFilter = currentAccessFilter();
      if (accessFilter !== "all" && stepAccess(step) !== accessFilter) return false;
      if (!needle) return true;
      return `${flow.name} ${step.name} ${step.id} ${step.type} ${step.access || ""}`.toLowerCase().includes(needle);
    }

    function sidebarSteps(flow, flowIndex, needle = state.filter.trim().toLowerCase()) {
      return flow.steps
        .map((step, stepIndex) => ({ step, stepIndex }))
        .filter(({ step }) => matchesSidebarFilters(flow, step, needle));
    }

    function firstVisibleStepRef() {
      const needle = state.filter.trim().toLowerCase();
      for (let flowIndex = 0; flowIndex < state.spec.flows.length; flowIndex += 1) {
        const step = sidebarSteps(state.spec.flows[flowIndex], flowIndex, needle)[0];
        if (step) return { flowIndex, stepIndex: step.stepIndex };
      }
      return null;
    }

    function ensureActiveStepVisible() {
      const flow = state.spec.flows[state.activeFlow];
      if (!flow) return;
      if (sidebarSteps(flow, state.activeFlow).some(({ stepIndex }) => stepIndex === state.activeStep)) return;
      const next = firstVisibleStepRef();
      if (!next) return;
      state.activeFlow = next.flowIndex;
      state.activeStep = next.stepIndex;
    }

    function renderAccessFilter() {
      const activeFilter = currentAccessFilter();
      const counts = { all: 0, public: 0, protected: 0 };
      for (const flow of state.spec.flows) {
        for (const step of flow.steps) {
          counts.all += 1;
          const access = stepAccess(step);
          if (access) counts[access] += 1;
        }
      }
      $("accessFilter").innerHTML = accessFilterDefs.map((filter) => `
        <button
          type="button"
          class="access-filter-button ${activeFilter === filter.id ? "active" : ""}"
          data-access-filter="${escapeAttr(filter.id)}"
        >${escapeHtml(filter.label)} ${escapeHtml(String(counts[filter.id]))}</button>
      `).join("");

      document.querySelectorAll("[data-access-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          state.accessFilter = button.dataset.accessFilter || "all";
          ensureActiveStepVisible();
          render();
        });
      });
    }

    function runnerPath(step = activeStep()) {
      if (isPendingStep(step)) return "";
      if (step.type === "http") return "/run/http";
      if (step.type === "near-view") return "/run/near-view";
      return "/run/script";
    }

    function runnerUrl(step = activeStep()) {
      if (isPendingStep(step)) return "";
      return `${location.origin}${runnerPath(step)}`;
    }

    function requestTemplate(step = activeStep()) {
      if (state.requestTemplates[step.id] !== undefined) return state.requestTemplates[step.id];
      if (isPendingStep(step)) return pendingReason(step);
      if (step.type === "http") return step.url || "";
      if (step.type === "near-view") return `${step.contractId || ""} :: ${step.methodName || ""}`;
      return `${step.command || ""} ${(step.args || []).join(" ")}`;
    }

    function allVars(step = activeStep()) {
      const vars = { ...state.env, ...state.vars };
      for (const [key, value] of Object.entries(currentInputs(step))) {
        if (value !== undefined && value !== null && value !== "") {
          vars[key] = value;
        }
      }
      for (const key of environmentOwnedKeys) {
        if (key in state.env) vars[key] = state.env[key] ?? "";
      }
      return vars;
    }

    function inputDisplayValue(key, value) {
      if (environmentOwnedKeys.has(key) && key in state.env) {
        return String(state.env[key] ?? "");
      }
      if (value === undefined || value === null || value === "") {
        const fallback = state.vars[key] ?? state.env[key];
        if (fallback !== undefined && fallback !== null) return String(fallback);
      }
      return String(value ?? "");
    }

    function inputLabel(step, key) {
      const flowLabels = activeFlow()?.inputLabels || {};
      const stepLabels = step.inputLabels || {};
      return String(stepLabels[key] || flowLabels[key] || key);
    }

    function inputLabelList(step, keys) {
      return keys.map((key) => inputLabel(step, key)).join(", ");
    }

    function templateVars(value) {
      const keys = new Set();
      const visit = (item) => {
        if (typeof item === "string") {
          for (const match of item.matchAll(/\{\{([^}]+)\}\}/g)) {
            const key = match[1]?.trim();
            if (key) keys.add(key);
          }
          return;
        }
        if (Array.isArray(item)) {
          item.forEach(visit);
          return;
        }
        if (item && typeof item === "object") {
          Object.values(item).forEach(visit);
        }
      };
      visit(value);
      return keys;
    }

    function templateTokens(value) {
      return [...String(value ?? "").matchAll(/\{\{([^}]+)\}\}/g)]
        .map((match) => {
          const raw = match[0];
          const start = match.index ?? 0;
          return {
            raw,
            key: match[1]?.trim() || "",
            start,
            end: start + raw.length
          };
        })
        .filter((token) => token.key);
    }

    function templateVarDisplay(key, step = activeStep()) {
      const vars = allVars(step);
      if (!(key in vars) || vars[key] === undefined || vars[key] === null) {
        return { status: "missing", value: "Missing value" };
      }
      if (String(vars[key]) === "") {
        return { status: "missing", value: "Empty value" };
      }
      if (isSensitiveKey(key)) {
        return { status: "redacted", value: "[redacted]" };
      }
      const value = typeof vars[key] === "object"
        ? JSON.stringify(vars[key], null, 2)
        : String(vars[key]);
      return { status: "set", value };
    }

    function renderTemplateHighlight(value, step = activeStep()) {
      const text = String(value ?? "");
      const tokens = templateTokens(text);
      if (!tokens.length) {
        return `<span class="template-overlay-content">${escapeHtml(text) || "&nbsp;"}</span>`;
      }
      let cursor = 0;
      let html = "";
      for (const token of tokens) {
        html += escapeHtml(text.slice(cursor, token.start));
        const display = templateVarDisplay(token.key, step);
        const classes = display.status === "missing" ? "template-var missing" : "template-var";
        html += `<span class="${classes}">${escapeHtml(token.raw)}</span>`;
        cursor = token.end;
      }
      html += escapeHtml(text.slice(cursor));
      return `<span class="template-overlay-content">${html}</span>`;
    }

    function syncRequestTargetOverlayScroll() {
      const input = $("requestTarget");
      const overlay = $("requestTargetOverlay");
      if (!input || !overlay) return;
      overlay.style.setProperty("--template-scroll-left", `${input.scrollLeft}px`);
    }

    function renderRequestTargetOverlay(step = activeStep()) {
      const input = $("requestTarget");
      const overlay = $("requestTargetOverlay");
      if (!input || !overlay) return;
      overlay.innerHTML = renderTemplateHighlight(input.value, step);
      syncRequestTargetOverlayScroll();
    }

    function parseCssPixel(value) {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function requestTargetCharWidth(input) {
      if (!textMeasureCanvas) textMeasureCanvas = document.createElement("canvas");
      const context = textMeasureCanvas.getContext("2d");
      if (!context) return 7.2;
      const style = window.getComputedStyle(input);
      context.font = style.font || `${style.fontSize} ${style.fontFamily}`;
      return context.measureText("0").width || 7.2;
    }

    function requestTargetTokenAtPoint(event) {
      const input = $("requestTarget");
      if (!input) return null;
      const text = input.value || "";
      const tokens = templateTokens(text);
      if (!tokens.length) return null;
      const rect = input.getBoundingClientRect();
      const style = window.getComputedStyle(input);
      const x = event.clientX
        - rect.left
        - parseCssPixel(style.borderLeftWidth)
        - parseCssPixel(style.paddingLeft)
        + input.scrollLeft;
      if (x < 0) return null;
      const index = Math.floor(x / requestTargetCharWidth(input));
      return tokens.find((token) => index >= token.start && index < token.end) || null;
    }

    function showVariableTooltip(token, event, step = activeStep()) {
      const tooltip = $("variableTooltip");
      if (!tooltip) return;
      const display = templateVarDisplay(token.key, step);
      tooltip.classList.toggle("missing", display.status === "missing");
      tooltip.innerHTML = `
        <div class="variable-tooltip-key">${escapeHtml(token.raw)}</div>
        <div class="variable-tooltip-value">${escapeHtml(display.value)}</div>
      `;
      tooltip.hidden = false;
      const rect = tooltip.getBoundingClientRect();
      const margin = 8;
      let left = event.clientX + 12;
      const preferAbove = window.innerWidth <= 680;
      let top = preferAbove ? event.clientY - rect.height - 10 : event.clientY + 14;
      if (left + rect.width > window.innerWidth - margin) left = window.innerWidth - rect.width - margin;
      if (top < margin) top = event.clientY + 14;
      if (top + rect.height > window.innerHeight - margin) top = event.clientY - rect.height - 10;
      tooltip.style.left = `${Math.max(margin, left)}px`;
      tooltip.style.top = `${Math.max(margin, top)}px`;
    }

    function hideVariableTooltip() {
      const tooltip = $("variableTooltip");
      if (tooltip) tooltip.hidden = true;
    }

    function handleRequestTargetVariableHover(event) {
      const token = requestTargetTokenAtPoint(event);
      if (!token) {
        hideVariableTooltip();
        return;
      }
      showVariableTooltip(token, event);
    }

    function stepInputKeys(inputs) {
      return Object.keys(inputs).filter((key) => !environmentOwnedKeys.has(key));
    }

    function inputKeysFrom(step, keys) {
      const inputs = currentInputs(step);
      return stepInputKeys(inputs).filter((key) => keys.has(key));
    }

    function headerInputKeys(step) {
      return inputKeysFrom(step, templateVars(step.headers || {}));
    }

    function targetTemplateKeys(step) {
      const keys = new Set();
      if (step.type === "http") {
        templateVars(requestTemplate(step)).forEach((key) => keys.add(key));
      }
      if (step.type === "near-view") {
        templateVars(step.contractId || "").forEach((key) => keys.add(key));
        templateVars(step.methodName || "").forEach((key) => keys.add(key));
      }
      if (step.type === "script") {
        templateVars(step.command || "").forEach((key) => keys.add(key));
        templateVars(step.cwd || "").forEach((key) => keys.add(key));
      }
      return keys;
    }

    function targetInputKeys(step) {
      return inputKeysFrom(step, targetTemplateKeys(step));
    }

    function bodyInputKeys(step) {
      if (step.type === "http") return inputKeysFrom(step, templateVars(step.body));
      if (step.type === "near-view") return inputKeysFrom(step, templateVars(step.args || {}));
      if (step.type === "script") {
        const inputs = currentInputs(step);
        const targetVars = new Set(targetInputKeys(step));
        return stepInputKeys(inputs).filter((key) => !targetVars.has(key));
      }
      return [];
    }

    function paramsInputKeys(step) {
      const inputs = currentInputs(step);
      const targetVars = new Set(targetInputKeys(step));
      const headerVars = new Set(headerInputKeys(step));
      const bodyVars = new Set(bodyInputKeys(step));
      return stepInputKeys(inputs).filter((key) => {
        if (targetVars.has(key)) return true;
        return !headerVars.has(key) && !bodyVars.has(key);
      });
    }

    function interpolate(value, vars) {
      if (typeof value === "string") {
        return value.replace(/\{\{([^}]+)\}\}/g, (_, key) => {
          const value = vars[key.trim()];
          return value === undefined || value === null ? "" : String(value);
        });
      }
      if (Array.isArray(value)) return value.map((item) => interpolate(item, vars));
      if (value && typeof value === "object") {
        return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, interpolate(item, vars)]));
      }
      return value;
    }

    function getPath(source, path) {
      return path.split(".").reduce((acc, key) => {
        if (acc === undefined || acc === null) return undefined;
        return acc[key];
      }, source);
    }

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function missingTargetValues(step) {
      const vars = allVars(step);
      const inputs = currentInputs(step);
      const missingEnv = [];
      const missingInputs = [];
      for (const key of targetTemplateKeys(step)) {
        if (hasValue(vars[key])) continue;
        if (environmentOwnedKeys.has(key)) {
          missingEnv.push(key);
        } else if (key in inputs) {
          missingInputs.push(key);
        }
      }
      return { missingEnv, missingInputs };
    }

    function ensureTargetValues(step) {
      const missing = missingTargetValues(step);
      if (missing.missingEnv.length) {
        throw new Error(`Missing environment value: ${missing.missingEnv.join(", ")}. Open Environment and fill it for this target.`);
      }
      if (missing.missingInputs.length) {
        throw new Error(`Missing URL/path input: ${inputLabelList(step, missing.missingInputs)}. Fill the field or run the upstream step that extracts it.`);
      }
    }

    function autoFillRules(step = activeStep()) {
      return Array.isArray(step.autoFill) ? step.autoFill : [];
    }

    function queueAutoFill() {
      if (!state.spec || !autoFillRules(activeStep()).length) return;
      if (autoFillTimer) clearTimeout(autoFillTimer);
      autoFillTimer = setTimeout(() => {
        autoFillTimer = null;
        applyAutoFillRules(activeStep()).catch((error) => {
          console.warn(error);
        });
      }, 200);
    }

    async function ensureAutoFillForStep(step) {
      if (!autoFillRules(step).length) return;
      const summary = await applyAutoFillRules(step);
      const missing = autoFillRules(step)
        .filter((rule) => !hasValue(currentInputs(step)[rule.input]))
        .map((rule) => rule.input);
      if (!missing.length) return;
      const detail = [...summary.errors, ...summary.skipped].filter(Boolean).join(" ");
      throw new Error(
        `Could not auto-fill ${missing.join(", ")}. Run the quote step first or enter the value manually.${detail ? ` ${detail}` : ""}`
      );
    }

    async function applyAutoFillRules(step) {
      const summary = { changed: false, errors: [], skipped: [] };
      for (const rule of autoFillRules(step)) {
        const result = await applyAutoFillRule(step, rule);
        summary.changed = summary.changed || result.changed;
        if (result.error) summary.errors.push(result.error);
        if (result.skipped) summary.skipped.push(result.skipped);
      }
      if (summary.changed) {
        renderRequest();
        renderVars();
        if (state.activeTab === "preview") renderPreview(step);
        persist();
      }
      return summary;
    }

    async function applyAutoFillRule(step, rule) {
      const targetInputs = currentInputs(step);
      if (!rule.input || hasValue(targetInputs[rule.input])) {
        return { changed: false };
      }

      const sourceStep = findStepById(rule.stepId);
      if (!sourceStep) {
        return { changed: false, error: `Auto-fill source step not found: ${rule.stepId}` };
      }

      const vars = allVars(step);
      const missingInputs = (rule.requiredInputs || []).filter((key) => !hasValue(vars[key]));
      if (missingInputs.length) {
        return { changed: false, skipped: `Waiting for ${missingInputs.join(", ")} before auto-fill.` };
      }

      const flightKey = `${step.id}:${rule.input}:${rule.stepId}:${(rule.requiredInputs || []).map((key) => vars[key]).join(":")}`;
      if (!autoFillInFlight.has(flightKey)) {
        autoFillInFlight.set(
          flightKey,
          runAutoFillSource(step, rule, sourceStep, vars).finally(() => {
            autoFillInFlight.delete(flightKey);
          })
        );
      }
      return autoFillInFlight.get(flightKey);
    }

    async function runAutoFillSource(step, rule, sourceStep, vars) {
      const sourceInputs = { ...(sourceStep.inputs || {}), ...(state.inputs[sourceStep.id] || {}) };
      for (const key of Object.keys(sourceInputs)) {
        if (hasValue(vars[key])) sourceInputs[key] = String(vars[key]);
      }

      const response = await fetch(runnerPath(sourceStep), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          stepId: sourceStep.id,
          env: state.env,
          inputs: sourceInputs,
          vars: state.vars
        })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        return { changed: false, error: `Auto-fill ${rule.input} failed from ${sourceStep.name}.` };
      }

      const value = getPath({ response: result }, rule.source || "");
      if (!hasValue(value)) {
        return { changed: false, error: `Auto-fill ${rule.input} did not return ${rule.source}.` };
      }

      const targetInputs = currentInputs(step);
      if (hasValue(targetInputs[rule.input])) {
        return { changed: false };
      }

      targetInputs[rule.input] = String(value);
      state.vars[rule.input] = String(value);
      document.querySelectorAll("[data-input]").forEach((input) => {
        if (input.dataset.input === rule.input) input.value = String(value);
      });
      showToast(`Auto-filled ${rule.input}`);
      return { changed: true };
    }

    function resolvedTarget(step = activeStep()) {
      if (isPendingStep(step)) return `未完成: ${pendingReason(step)}`;
      const vars = allVars(step);
      if (step.type === "http") return interpolate(requestTemplate(step), vars);
      if (step.type === "near-view") {
        const rpc = vars.nearRpcUrl || "";
        const contract = interpolate(step.contractId || "", vars);
        const method = interpolate(step.methodName || "", vars);
        return `${rpc} -> ${contract}.${method}`;
      }
      const command = step.command || "";
      const args = interpolate(step.args || [], vars);
      const cwd = interpolate(step.cwd || "", vars);
      return `${cwd} $ ${[command, ...args].join(" ")}`;
    }

    function previewPayload(step = activeStep()) {
      if (isPendingStep(step)) {
        return {
          status: "未完成",
          runnable: false,
          reason: pendingReason(step)
        };
      }
      const vars = allVars(step);
      if (step.type === "http") {
        return {
          target: runnerPath(step),
          method: methodLabel(step),
          url: interpolate(requestTemplate(step), vars),
          headers: interpolate(step.headers || {}, vars),
          body: interpolate(step.body, vars)
        };
      }
      if (step.type === "near-view") {
        return {
          target: runnerPath(step),
          rpcUrl: vars.nearRpcUrl,
          contractId: interpolate(step.contractId, vars),
          methodName: interpolate(step.methodName, vars),
          args: interpolate(step.args || {}, vars)
        };
      }
      return {
        target: runnerPath(step),
        stepId: step.id,
        command: step.command,
        args: interpolate(step.args || [], vars),
        cwd: interpolate(step.cwd, vars)
      };
    }

    function render() {
      renderAccessFilter();
      renderSidebar();
      renderTopbar();
      renderRequest();
      renderTabs();
      renderVars();
      renderActiveStepResponse();
      persist();
      updateRequestUrl("replace");
      queueAutoFill();
    }

    function renderSidebar() {
      const needle = state.filter.trim().toLowerCase();
      $("flowList").innerHTML = state.spec.flows.map((flow, flowIndex) => {
        const flowKey = flowCollapseKey(flow, flowIndex);
        const stepsId = `flow-steps-${flowIndex}`;
        const hasActiveFilter = Boolean(needle) || currentAccessFilter() !== "all";
        const isCollapsed = !hasActiveFilter && state.collapsedFlows[flowKey] === true;
        const steps = sidebarSteps(flow, flowIndex, needle);
        if (!steps.length) return "";
        const countLabel = steps.length === flow.steps.length ? String(flow.steps.length) : `${steps.length}/${flow.steps.length}`;
        return `
          <div class="flow-block">
            <button
              type="button"
              class="flow-button ${flowIndex === state.activeFlow ? "active" : ""}"
              data-flow-toggle="${flowIndex}"
              aria-expanded="${isCollapsed ? "false" : "true"}"
              aria-controls="${stepsId}"
            >
              <span class="flow-title">
                <span class="flow-chevron" aria-hidden="true"></span>
                <span class="flow-sequence">Step ${flowIndex + 1}</span>
                <span class="flow-name">${escapeHtml(flow.name)}</span>
              </span>
              <span class="sidebar-label">${escapeHtml(countLabel)}</span>
            </button>
            <div id="${stepsId}" class="step-list" ${isCollapsed ? "hidden" : ""}>
              ${steps.map(({ step, stepIndex }) => `
                <button
                  type="button"
                  class="step-button ${flowIndex === state.activeFlow && stepIndex === state.activeStep ? "active" : ""}"
                  data-flow="${flowIndex}"
                  data-step="${stepIndex}"
                  data-step-id="${escapeAttr(step.id)}"
                  ${flowIndex === state.activeFlow && stepIndex === state.activeStep ? "aria-current=\"true\"" : ""}
                >
                  <span class="step-index">${flowIndex + 1}.${stepIndex + 1}</span>
                  <span class="verb ${escapeAttr(methodClass(step))}">${escapeHtml(methodLabel(step))}</span>
                  <strong>${escapeHtml(step.name)}</strong>
                  ${accessLabel(step) ? `<span class="access-tag ${escapeAttr(stepAccess(step))}">${escapeHtml(accessLabel(step))}</span>` : ""}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");

      document.querySelectorAll("[data-flow-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const flowIndex = Number(button.dataset.flowToggle);
          const flow = state.spec.flows[flowIndex];
          const flowKey = flowCollapseKey(flow, flowIndex);
          state.collapsedFlows[flowKey] = state.collapsedFlows[flowKey] !== true;
          renderSidebar();
          persist();
        });
      });

      document.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          selectStep(Number(button.dataset.flow), Number(button.dataset.step), { historyMode: "push" });
        });
        button.addEventListener("keydown", handleSidebarStepKeydown);
      });
    }

    function flowCollapseKey(flow, flowIndex) {
      return flow.id || flow.name || String(flowIndex);
    }

    function renderTopbar() {
      const flow = activeFlow();
      const step = activeStep();
      const profile = activeEnvironmentProfile();
      $("crumbFlow").textContent = flow.name;
      $("crumbStep").textContent = step.name;
      $("workspacePill").textContent = profile.label;
      $("envDot").className = `env-dot ${escapeAttr(state.activeEnvProfile)}`;
      $("envSelect").innerHTML = envProfileIds().map((profileId) => {
        const optionProfile = environmentProfiles[profileId];
        return `<option value="${escapeAttr(profileId)}">${escapeHtml(optionProfile.label)}</option>`;
      }).join("");
      $("envSelect").value = state.activeEnvProfile;
      $("envDrawer").classList.toggle("open", state.envOpen);
      $("envProfileName").textContent = `${profile.label} Environment`;
      $("envProfileBranch").textContent = profile.branch;
      $("envProfileDescription").textContent = profile.description;
      $("envEditor").value = JSON.stringify(state.env, null, 2);
      $("varsEditor").value = JSON.stringify(state.vars, null, 2);
    }

    function renderRequest() {
      const flow = activeFlow();
      const step = activeStep();
      const method = methodLabel(step);
      const pending = isPendingStep(step);
      const envUpdateCount = Object.keys(step.setEnv || {}).length;
      $("stepName").textContent = step.name;
      $("stepDescription").textContent = step.description || "No description has been added for this request yet.";
      $("stepType").textContent = `${flow.name} / ${step.id}`;
      $("methodSelect").innerHTML = `<option>${method}</option>`;
      $("methodSelect").disabled = pending;
      $("requestTarget").value = requestTemplate(step);
      $("requestTarget").readOnly = pending || step.type !== "http";
      $("requestTarget").classList.toggle("pending", pending);
      renderRequestTargetOverlay(step);
      $("fireStep").disabled = pending;
      $("fireStep").textContent = pending ? "未完成" : "Send";
      $("requestPills").innerHTML = pending
        ? `<span class="pill pending">未完成</span>`
        : `
          <span class="pill">${step.type}</span>
          <span class="pill">${Object.keys(step.setVars || {}).length} extracts</span>
          ${envUpdateCount ? `<span class="pill">${envUpdateCount} env updates</span>` : ""}
        `;
      $("responseTarget").textContent = pending
        ? resolvedTarget(step)
        : `Ready to send to ${resolvedTarget(step)}`;
    }

    function renderTabs() {
      $("tabs").innerHTML = tabs.map((tab) => `
        <button class="tab ${tab.id === state.activeTab ? "active" : ""}" data-tab="${tab.id}">${tab.label}</button>
      `).join("");

      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeTab = button.dataset.tab;
          renderTabs();
          persist();
        });
      });

      const step = activeStep();
      if (state.activeTab === "params") renderParams(step);
      if (state.activeTab === "headers") renderHeaders(step);
      if (state.activeTab === "body") renderBody(step);
      if (state.activeTab === "vars") renderVarsTab(step);
      if (state.activeTab === "preview") renderPreview(step);
    }

    function renderInputFields(step, keys, emptyText) {
      const inputs = currentInputs(step);
      return keys.length ? `
        <div class="fields params-fields">
          ${keys.map((key) => `
            <div class="kv-row">
              <input class="input" value="${escapeAttr(inputLabel(step, key))}" title="${escapeAttr(key)}" readonly />
              <input class="input" data-input="${escapeAttr(key)}" value="${escapeAttr(inputDisplayValue(key, inputs[key]))}" />
            </div>
          `).join("")}
        </div>
      ` : `<div class="empty">${escapeHtml(emptyText)}</div>`;
    }

    function bindInputFields(step, onInput = () => {}) {
      document.querySelectorAll("[data-input]").forEach((input) => {
        input.addEventListener("input", () => {
          const key = input.dataset.input;
          currentInputs(step)[key] = input.value;
          if (environmentOwnedKeys.has(key)) {
            state.env[key] = input.value;
          }
          renderRequest();
          onInput();
          if (state.activeTab === "preview") renderPreview(step);
          persist();
          queueAutoFill();
        });
      });
    }

    function renderParams(step) {
      $("tabBody").innerHTML = renderInputFields(
        step,
        paramsInputKeys(step),
        "No URL/path or unclassified inputs for this step."
      );
      bindInputFields(step);
    }

    function renderHeaders(step) {
      if (step.type !== "http") {
        $("tabBody").innerHTML = `<div class="empty">No headers for this step.</div>`;
        return;
      }
      const keys = headerInputKeys(step);
      const headers = interpolate(step.headers || {}, allVars(step));
      const preview = Object.keys(headers).length
        ? `<pre id="headersPreview" class="light-code">${escapeHtml(JSON.stringify(headers, null, 2))}</pre>`
        : "";
      $("tabBody").innerHTML = `
        ${renderInputFields(step, keys, "No editable header inputs for this step.")}
        ${preview}
      `;
      bindInputFields(step, () => {
        const previewElement = document.getElementById("headersPreview");
        if (previewElement) previewElement.textContent = JSON.stringify(interpolate(step.headers || {}, allVars(step)), null, 2);
      });
    }

    function bodyPayload(step) {
      if (isPendingStep(step)) {
        return {
          status: "未完成",
          reason: pendingReason(step)
        };
      }
      if (step.type === "http") return interpolate(step.body, allVars(step));
      if (step.type === "near-view") return interpolate(step.args || {}, allVars(step));
      if (step.type === "script") {
        return {
          command: step.command,
          args: interpolate(step.args || [], allVars(step)),
          cwd: interpolate(step.cwd, allVars(step))
        };
      }
      return undefined;
    }

    function renderBody(step) {
      const keys = bodyInputKeys(step);
      const payload = bodyPayload(step);
      const preview = payload === undefined
        ? ""
        : `<pre id="bodyPreview" class="light-code">${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
      $("tabBody").innerHTML = `
        ${renderInputFields(step, keys, "No editable body or argument inputs for this step.")}
        ${preview}
      `;
      bindInputFields(step, () => {
        const previewElement = document.getElementById("bodyPreview");
        const payload = bodyPayload(step);
        if (previewElement && payload !== undefined) previewElement.textContent = JSON.stringify(payload, null, 2);
      });
    }

    function renderVarsTab(step) {
      $("tabBody").innerHTML = `
        <div class="fields">
          <div class="field">
            <label>Runtime Variables</label>
            <textarea id="varsTabEditor" class="textarea">${escapeHtml(JSON.stringify(state.vars, null, 2))}</textarea>
          </div>
          <div class="field">
            <label>Variables Extracted By This Step</label>
            <pre class="light-code">${escapeHtml(JSON.stringify(step.setVars || {}, null, 2))}</pre>
          </div>
          <div class="field">
            <label>Environment Updated By This Step</label>
            <pre class="light-code">${escapeHtml(JSON.stringify(step.setEnv || {}, null, 2))}</pre>
          </div>
        </div>
      `;
      $("varsTabEditor").addEventListener("input", () => {
        try {
          state.vars = parseJsonObject($("varsTabEditor").value || "{}", "Runtime variables");
