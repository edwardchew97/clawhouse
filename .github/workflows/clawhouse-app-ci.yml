name: ClawHouse App CI

on:
  pull_request:
    paths:
      - ".github/workflows/clawhouse-app-ci.yml"
      - "apps/clawhouse-app/**"
      - "package.json"
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - ".github/workflows/clawhouse-app-ci.yml"
      - "apps/clawhouse-app/**"
      - "package.json"

jobs:
  app:
    name: ClawHouse App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clawhouse-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
