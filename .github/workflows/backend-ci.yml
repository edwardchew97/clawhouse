name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "apps/agent-board-ledger/**"
      - "tools/near-wallet/**"
      - "package.json"
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "apps/agent-board-ledger/**"
      - "tools/near-wallet/**"
      - "package.json"

jobs:
  ledger:
    name: Agent Board Ledger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-board-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install wallet tool dependencies
        working-directory: tools/near-wallet
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
